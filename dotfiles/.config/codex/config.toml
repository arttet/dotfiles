# Codex configuration (config.toml).

################################################################################
# Model and response behavior
################################################################################

model = "gpt-5.6-terra"
model_provider = "openai"
personality = "pragmatic"

model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
model_reasoning_summary = "auto"
model_verbosity = "medium"

################################################################################
# Execution, authentication, and project discovery
################################################################################

approval_policy = "on-request"
sandbox_mode = "workspace-write"
default_permissions = "workspace"
allow_login_shell = true
web_search = "cached"

cli_auth_credentials_store = "auto"
mcp_oauth_credentials_store = "auto"

project_doc_max_bytes = 32768
file_opener = "none"
service_tier = "default"

################################################################################
# History and process environment
################################################################################

[history]
persistence = "save-all"
max_bytes = 52428800

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

################################################################################
# Workspace sandbox and sensitive-file policy
################################################################################

[sandbox_workspace_write]
writable_roots = []
network_access = false
exclude_tmpdir_env_var = false
exclude_slash_tmp = false

[permissions.workspace.filesystem]
glob_scan_max_depth = 8
":workspace_roots" = { "." = "write", "**/.env" = "deny", "**/.env.*" = "deny", "**/*.key" = "deny", "**/*.pem" = "deny", "**/*.netrc" = "deny", "**/.netrc" = "deny", "**/.ssh/**" = "deny", "**/.gnupg/**" = "deny", "**/.kube/config" = "deny", "**/.aws/**" = "deny", "**/.azure/**" = "deny", "**/.config/gcloud/**" = "deny", "**/*credentials.json" = "deny", "**/.git-credentials" = "deny", "**/gh/hosts.yml" = "deny", "**/.npmrc" = "deny", "**/.cargo/credentials*" = "deny", "**/.docker/config.json" = "deny" }

################################################################################
# Agent runtime and stable feature selection
################################################################################

[agents]
max_threads = 8
max_depth = 1
job_max_runtime_seconds = 1800

[features]
multi_agent = true
shell_snapshot = true
unified_exec = true
skill_mcp_dependency_install = true
fast_mode = true

################################################################################
# Terminal UI and telemetry
################################################################################

[tui]
notifications = true
animations = true
show_tooltips = true
status_line = [
  "model-with-reasoning",
  "context-remaining",
  "git-branch",
  "project-name",
  "branch-changes",
  "five-hour-limit",
  "weekly-limit",
  "task-progress",
  "used-tokens",
  "total-input-tokens",
  "total-output-tokens",
  "approval-mode",
  "context-used",
  "context-window-size",
]
terminal_title = ["spinner", "project"]
theme = "nord"
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.6-sol" = 3

[analytics]
enabled = false

[feedback]
enabled = false

[otel]
log_user_prompt = false
environment = "none"
exporter = "none"
trace_exporter = "none"
metrics_exporter = "none"

[windows]
sandbox = "elevated"

################################################################################
# MCP servers
################################################################################

[mcp_servers.serena]
command = "serena-agent"
args = [
  "start-mcp-server",
  "--context=codex",
  "--project-from-cwd",
  "--open-web-dashboard=false",
]
env = { PYTHONUNBUFFERED = "1" }
startup_timeout_sec = 30
tool_timeout_sec = 120
enabled = true

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
startup_timeout_sec = 10
tool_timeout_sec = 60
enabled = true

[mcp_servers.context7]
command = "context7-mcp"
args = []
startup_timeout_sec = 60
tool_timeout_sec = 120
enabled = true

[mcp_servers.playwright]
command = "playwright-mcp"
args = []
startup_timeout_sec = 60
tool_timeout_sec = 120
enabled = true

[mcp_servers.graphify]
command = "graphify-mcp"
args = ["graphify-out/graph.json"]
startup_timeout_sec = 60
tool_timeout_sec = 120
enabled = true

[mcp_servers.vikunja]
command = "vikunja-mcp"
args = []
env = { VIKUNJA_URL = "${VIKUNJA_URL}", VIKUNJA_API_TOKEN = "${VIKUNJA_API_TOKEN}" }
startup_timeout_sec = 60
tool_timeout_sec = 120
enabled = false

[projects.'c:\users\artyom\documents\github\dotfiles']
trust_level = "trusted"

[hooks.state]

[hooks.state.'C:\Users\Artyom\.config\codex\hooks.json:session_start:0:0']
