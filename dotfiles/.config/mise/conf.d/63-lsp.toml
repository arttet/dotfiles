# Tier: language servers without a toolchain file of their own.
#
# Language server inventory:
# https://microsoft.github.io/language-server-protocol/implementors/servers/
#
# NOTE: Helix does not install language servers.

[tool_alias]
dockerls = "github:docker/docker-language-server"
just-lsp = "github:terror/just-lsp"
sqls = "github:sqls-server/sqls"

[tools]
buf = "1.72.0"
dockerls = "0.20.1"
helm-ls = "0.5.4"
just-lsp = "0.6.1"
lua-language-server = "3.19.0"
marksman = "2026-02-08"
sqls = "0.2.48"

"npm:@tailwindcss/language-server" = "0.16.0"
"npm:bash-language-server" = "5.6.0"
"npm:typescript-language-server" = "5.3.0"
"npm:vscode-json-languageserver" = "1.3.4"
"npm:yaml-language-server" = "1.24.0"

"pipx:cmake-language-server" = "0.1.11"
