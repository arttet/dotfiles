# Tier: C/C++ toolchain.

[tool_alias]
codelldb = "github:vadimcn/codelldb"
llvm = "github:llvm/llvm-project"

[tools]
cmake = "4.4.2"
conan = "2.31.2"
mold = { version = "2.41.0", os = ["linux", "macos"] }
ninja = "1.13.2"

[tools.llvm]
version = "22.1.8"
version_prefix = "llvmorg-"
strip_components = 1
bin_path = "bin"

[tools.llvm.platforms]
windows-x64 = { asset_pattern = "*llvm-{{ version }}-x86_64-pc-windows-msvc.tar.xz" }
windows-arm64 = { asset_pattern = "*llvm-{{ version }}-aarch64-pc-windows-msvc.tar.xz" }
linux-x64 = { asset_pattern = "LLVM-{{ version }}-Linux-X64.tar.xz" }
linux-arm64 = { asset_pattern = "LLVM-{{ version }}-Linux-ARM64.tar.xz" }
macos-arm64 = { asset_pattern = "LLVM-{{ version }}-macOS-ARM64.tar.xz" }

[tools.codelldb]
version = "1.12.2"
version_prefix = "v"
os = ["windows"]
bin_path = "extension/adapter"
