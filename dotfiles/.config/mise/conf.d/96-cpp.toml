# Tier: C/C++ toolchain.

[tool_alias]
codelldb = "github:vadimcn/codelldb"
llvm = "github:llvm/llvm-project"

[tools]
cmake = "4.4.5"
conan = "2.34.0"
mold = { version = "3.0.0", os = ["linux"] }
ninja = "1.13.2"
codelldb = { version = "1.12.3", version_prefix = "v", bin_path = "extension/adapter", os = ["windows"] }
llvm = { version = "23.1.4", version_prefix = "llvmorg-", strip_components = "1", bin_path = "bin", platforms = { windows-x64 = { asset_pattern = "*llvm-{{ version }}-x86_64-pc-windows-msvc.tar.xz" }, windows-arm64 = { asset_pattern = "*llvm-{{ version }}-aarch64-pc-windows-msvc.tar.xz" }, linux-x64 = { asset_pattern = "LLVM-{{ version }}-Linux-X64.tar.xz" }, linux-arm64 = { asset_pattern = "LLVM-{{ version }}-Linux-ARM64.tar.xz" }, macos-arm64 = { asset_pattern = "LLVM-{{ version }}-macOS-ARM64.tar.xz" } } }
