# Plugins and themes deployed to XDG_CONFIG_HOME. Wallpapers live in vendir.wallpapers.yml so that
# `just deploy config` -- the sync CI runs -- does not pull ~1.1 GB of images nobody there needs.
apiVersion: vendir.k14s.io/v1alpha1
kind: Config

directories:
  # ===========================================================================
  # Alacritty
  # ===========================================================================
  - path: dotfiles/.config/alacritty/themes
    contents:
      - path: themes
        git:
          url: https://github.com/alacritty/alacritty-theme
          ref: master
          lfsSkipSmudge: true
          skipInitSubmodules: true
        includePaths:
          - themes/catppuccin_frappe.toml
          - themes/catppuccin_latte.toml
          - themes/catppuccin_macchiato.toml
          - themes/catppuccin_mocha.toml

          - themes/gruvbox_dark.toml
          - themes/gruvbox_light.toml

          - themes/nord.toml
          - themes/nord_light.toml
        newRootPath: themes

  # ===========================================================================
  # Tmux
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Tmux plugins
  # ---------------------------------------------------------------------------

  # - path: dotfiles/.config/tmux/plugins/tmux-sensible
  #   contents:
  #     - path: .
  #       git:
  #         url: https://github.com/tmux-plugins/tmux-sensible
  #         ref: origin/master
  #         depth: 1
  #         lfsSkipSmudge: true
  #         skipInitSubmodules: true

  - path: dotfiles/.config/tmux/plugins/tmux-resurrect
    contents:
      - path: .
        git:
          url: https://github.com/tmux-plugins/tmux-resurrect
          ref: master
          lfsSkipSmudge: true
          skipInitSubmodules: true
        includePaths:
          - resurrect.tmux
          - scripts/**
          - save_command_strategies/**
          - strategies/**

  - path: dotfiles/.config/tmux/plugins/tmux-continuum
    contents:
      - path: .
        git:
          url: https://github.com/tmux-plugins/tmux-continuum
          ref: master
          lfsSkipSmudge: true
          skipInitSubmodules: true
        includePaths:
          - continuum.tmux
          - scripts/**
        excludePaths:
          - scripts/handle_tmux_automatic_start/README.md

  # - path: dotfiles/.config/tmux/plugins/tmux-sessionist
  #   contents:
  #     - path: .
  #       git:
  #         url: https://github.com/tmux-plugins/tmux-sessionist
  #         ref: origin/master
  #         depth: 1
  #         lfsSkipSmudge: true
  #         skipInitSubmodules: true

  - path: dotfiles/.config/tmux/plugins/tmux-yank
    contents:
      - path: .
        git:
          url: https://github.com/tmux-plugins/tmux-yank
          ref: master
          lfsSkipSmudge: true
          skipInitSubmodules: true
        includePaths:
          - yank.tmux
          - scripts/**

  - path: dotfiles/.config/tmux/plugins/tmux-fzf
    contents:
      - path: .
        git:
          url: https://github.com/sainnhe/tmux-fzf
          ref: master
          lfsSkipSmudge: true
          skipInitSubmodules: true
        includePaths:
          - main.sh
          - scripts/**

  # ---------------------------------------------------------------------------
  # Tmux status line framework
  # ---------------------------------------------------------------------------

  - path: dotfiles/.config/tmux/plugins/tmux2k
    contents:
      - path: .
        git:
          url: https://github.com/2KAbhishek/tmux2k
          ref: main
          lfsSkipSmudge: true
          skipInitSubmodules: true
        includePaths:
          - 2k.tmux
          - main.sh
          - lib/**
          - plugins/**

  # ===========================================================================
  # Yazi
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Yazi flavors
  # ---------------------------------------------------------------------------
  - path: dotfiles/.config/yazi/flavors/catppuccin-latte.yazi
