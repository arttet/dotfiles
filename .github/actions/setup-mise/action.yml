name: Setup mise
description: Install pinned mise binary with checksum verification and cached tool installs

inputs:
  version:
    description: mise version tag, for example v2026.7.11
    required: true
    default: v2026.7.11
  sha256:
    description: SHA-256 of mise-<version>-linux-x64-musl.tar.gz
    required: true
    default: 044157d43a442e3e48aab7d5da3ea0fa40250f53532a6024f93dffa37393a2ac
  install-tools:
    description: Install tools from the active mise configuration
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Restore mise cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.MISE_DATA_DIR || '~/.local/share/mise' }}
        key: mise-${{ runner.os }}-${{ hashFiles('mise.toml', 'mise.lock') }}
        restore-keys: |
          mise-${{ runner.os }}-

    - name: Install mise
      shell: bash
      env:
        MISE_TAG: ${{ inputs.version }}
        MISE_TGZ_SHA256: ${{ inputs.sha256 }}
      run: | # zizmor: ignore[github-env] GITHUB_PATH values are mise-internal paths, not attacker-controlled input
        set -euo pipefail
        data_dir="${MISE_DATA_DIR:-$HOME/.local/share/mise}"
        install_path="${MISE_INSTALL_PATH:-$data_dir/bin/mise}"
        if [ -x "$install_path" ] && [ "$("$install_path" version | cut -d' ' -f1)" = "${MISE_TAG#v}" ]; then
          echo "mise ${MISE_TAG} already installed"
        else
          cd "$RUNNER_TEMP"
          curl -fsSL -o "mise-${MISE_TAG}-linux-x64-musl.tar.gz" \
            "https://github.com/jdx/mise/releases/download/${MISE_TAG}/mise-${MISE_TAG}-linux-x64-musl.tar.gz"
          echo "${MISE_TGZ_SHA256}  mise-${MISE_TAG}-linux-x64-musl.tar.gz" | sha256sum -c -
          tar -xzf "mise-${MISE_TAG}-linux-x64-musl.tar.gz"
          mkdir -p "$(dirname "$install_path")"
          install -m 755 mise/bin/mise "$install_path"
        fi
        echo "$data_dir/bin" >> "$GITHUB_PATH"
        echo "$data_dir/shims" >> "$GITHUB_PATH"

    - name: Install tools
      if: inputs.install-tools == 'true'
      shell: bash
      run: |
        mise install
        # GitHub release archives can restore tool binaries without the executable bit.
        selene_path="$(find "$MISE_DATA_DIR/installs" -path '*/github-kampfkarren-selene/*/selene' -type f -print -quit)"
        if [ -z "$selene_path" ]; then
          echo "Selene binary was not found after mise install" >&2
          exit 1
        fi
        chmod 755 "$selene_path"
        echo "Restored executable permissions for $selene_path"
        mise reshim
