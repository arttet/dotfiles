name: Daily Cache Cleanup

on:
  schedule:
    - cron: "50 1 * * *" # Daily at 01:50 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read # Default read-only for all jobs

defaults:
  run:
    shell: bash

jobs:
  clear:
    name: Clear Caches
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    permissions:
      actions: write # Required to list and delete GitHub Actions caches.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load allowed endpoints
        id: endpoints
        run: |
          allowed="$(grep -hvE '^\s*(#|$)' .github/harden-runner/minimal.txt | xargs)"
          echo "list=${allowed}" >> "$GITHUB_OUTPUT"

      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: ${{ steps.endpoints.outputs.list }}

      - name: Clear all caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh cache delete --all --repo "$REPO"
