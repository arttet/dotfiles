name: Daily Cache Cleanup

on:
  schedule:
    - cron: "50 1 * * *" # Daily at 01:50 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read # Default read-only for all jobs

defaults:
  run:
    shell: bash

jobs:
  clear:
    name: Clear Caches
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    permissions:
      actions: write # Required to list and delete GitHub Actions caches.

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            *.github.com:443
            production.cloudfront.docker.com:443
            *.cloudfront.docker.com:443
            tuf-repo-cdn.sigstore.dev:443
            *.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clear all caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh cache delete --all --repo "$REPO"
