name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read # Default read-only for all jobs

defaults:
  run:
    shell: bash

env:
  NIXPKGS: github:NixOS/nixpkgs/nixos-unstable # Only the performance job: Bash and Zsh are not in the mise registry
  MISE_VERSION: v2026.7.17
  MISE_SHA256: 71b4a7720cf8f1e22adbc31fed6f0094e84b16d6e365a19c4afae354f1493b3a # mise-v2026.7.17-linux-x64-musl.tar.gz
  MISE_DATA_DIR: ${{ github.workspace }}/.tools/mise
  MISE_INSTALL_PATH: ${{ github.workspace }}/.tools/mise/bin/mise
  DPRINT_CACHE_DIR: ${{ github.workspace }}/.tools/dprint
  AUBE_TRUST_POLICY_EXCLUDE: pino@9.14.0,fastq@1.20.2
  MISE_LOCAL_ALLOWED_ENDPOINTS: >-
    *.blob.core.windows.net:443
    github.com:443
    api.osv.dev:443
    *.cloudfront.docker.com:443
    *.github.com:443
    files.pythonhosted.org:443
    nodejs.org:443
    objects.githubusercontent.com:443
    pypi.org:443
    registry.npmjs.org:443
    release-assets.githubusercontent.com:443
    plugins.dprint.dev:443
    mise-versions.jdx.dev:443
    jdx.dev:443
    *.jdx.dev:443
    *.sigstore.dev:443
  VALIDATE_MISE_INSTALL_ALLOWED_ENDPOINTS: >-
    crates.io:443
    dl.google.com:443
    formulae.brew.sh:443
    go.dev:443
    golang.org:443
    index.crates.io:443
    models.dev:443
    packages.microsoft.com:443
    raw.githubusercontent.com:443
    static.crates.io:443
    static.rust-lang.org:443
    ziglang.org:443
    zig.karearl.com:443
    zig.linus.dev:443
    ziglang.freetls.fastly.net:443
    zigmirror.com:443
    builds.zigtools.org:443
    zig.mirror.mschae23.de:443
    fs.liujiacai.net:443
    zig.tilok.dev:443
    zig.bcr.ist:443
    pkg.hexops.org:443
    storage.googleapis.com:443
    conda.anaconda.org:443
    proxy.golang.org:443
    sum.golang.org:443

jobs:
  # ==============================================================================
  # Stage 0: Trust classification
  # ==============================================================================
  guard:
    name: Guard
    runs-on: ubuntu-26.04
    timeout-minutes: 2

    outputs:
      trusted: ${{ steps.check.outputs.trusted }}

    steps:
      - name: Classify the run
        id: check
        env:
          TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: echo "trusted=$TRUSTED" >> "$GITHUB_OUTPUT"

  # ==============================================================================
  # Stage 1: Format Quality Gate
  # ==============================================================================
  fmt:
    name: Format
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: guard

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            ${{ env.MISE_LOCAL_ALLOWED_ENDPOINTS }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}

      - name: Format checks
        run: mise run fmt:all

  # ==============================================================================
  # Stage 1: Lint Quality Gate
  # ==============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: guard

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            ${{ env.MISE_LOCAL_ALLOWED_ENDPOINTS }}
            api.cloudflare.com:443
            starship.rs:443
            *.starship.rs:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}

      - name: Lint checks
        run: mise run lint:all

  # ==============================================================================
  # Stage 1: Security
  # ==============================================================================
  security:
    name: Security
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: guard

    permissions:
      contents: read # Default read-only for this job
      security-events: write # Required to upload security scan results to GitHub Security tab.

    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            ${{ env.MISE_LOCAL_ALLOWED_ENDPOINTS }}
            api.cloudflare.com:443
            api.deps.dev:443
            ghcr.io:443
            grype.anchore.io:443
            mirror.gcr.io:443
            pkg-containers.githubusercontent.com:443
            semgrep.dev:443
            toolbox-data.anchore.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}

      - name: Restore Trivy cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-${{ runner.os }}-

      - name: Restore aube cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/aube/store
          key: ${{ runner.os }}-aube-${{ hashFiles('docs/aube-workspace.yaml', 'docs/aube-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-

      - name: Restore CodeQL query pack cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.codeql
          key: codeql-${{ runner.os }}-${{ hashFiles('mise.lock') }}
          restore-keys: |
            codeql-${{ runner.os }}-

      - name: Install docs dependencies
        env:
          MISE_CONFIG_DIR: ${{ github.workspace }}/dotfiles/.config/mise
        run: mise run docs:install

      - name: Sync vendored components
        run: mise run deploy:sync:config

      - name: Security gate
        run: mise run security:all

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: ${{ needs.guard.outputs.trusted == 'true' && hashFiles('.tools/trivy/trivy-results.sarif') != '' }}
        with:
          sarif_file: .tools/trivy/trivy-results.sarif

      - name: Upload CodeQL SARIF (actions)
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: ${{ needs.guard.outputs.trusted == 'true' && hashFiles('.tools/codeql/actions.sarif') != '' }}
        with:
          sarif_file: .tools/codeql/actions.sarif
          category: actions

      - name: Upload CodeQL SARIF (javascript)
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: ${{ needs.guard.outputs.trusted == 'true' && hashFiles('.tools/codeql/javascript.sarif') != '' }}
        with:
          sarif_file: .tools/codeql/javascript.sarif
          category: javascript

  # ==============================================================================
  # Stage 1: Antivirus
  # ==============================================================================
  antivirus:
    name: Antivirus
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: guard

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            ${{ env.MISE_LOCAL_ALLOWED_ENDPOINTS }}
            *.cloudflarestorage.com:443
            auth.docker.io:443
            database.clamav.net:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}

      - name: Get current date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore ClamAV database cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/clamav-db
          key: clamav-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            clamav-${{ runner.os }}-

      - name: Update ClamAV database and scan for malware
        env:
          CLAMAV_EXCLUDE_DIR: '^/scandir/(\.git|\.tools)$'
        run: mise run antivirus:all

  # ==============================================================================
  # Stage 1: Documentation Gate
  # ==============================================================================
  docs:
    name: Documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: guard

    permissions:
      contents: read
      security-events: write # Required to upload the CodeQL results for the documentation sources.

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            ${{ env.MISE_LOCAL_ALLOWED_ENDPOINTS }}
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            raw.githubusercontent.com:443
            specifications.freedesktop.org:443
            www.nushell.sh:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}

      - name: Restore aube cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/aube/store
          key: ${{ runner.os }}-aube-${{ hashFiles('docs/aube-workspace.yaml', 'docs/aube-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-

      - name: Restore CodeQL query pack cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.codeql
          key: codeql-javascript-${{ runner.os }}-${{ hashFiles('mise.lock') }}
          restore-keys: |
            codeql-javascript-${{ runner.os }}-

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/lychee/.lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: |
            lychee-

      - name: Documentation gate
        env:
          MISE_CONFIG_DIR: ${{ github.workspace }}/dotfiles/.config/mise
          CI_BASE_URL: /
        run: mise run docs:all

      - name: Upload CodeQL SARIF (javascript)
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: ${{ always() && needs.guard.outputs.trusted == 'true' && hashFiles('.tools/codeql/javascript.sarif') != '' }}
        with:
          sarif_file: .tools/codeql/javascript.sarif
          category: javascript

      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-cloudflare-pages
          path: docs/dist

      - name: Build docs (GitHub Pages)
        env:
          MISE_CONFIG_DIR: ${{ github.workspace }}/dotfiles/.config/mise
          CI_BASE_URL: /dotfiles/
        run: mise run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: docs-github-pages
          path: docs/dist

  # ==============================================================================
  # Stage 2: Validate dotfiles configurations
  # ==============================================================================
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [guard, fmt, lint, security, docs]
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          # - macos-26
          # - windows-2025

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            ${{ env.MISE_LOCAL_ALLOWED_ENDPOINTS }}
            ${{ env.VALIDATE_MISE_INSTALL_ALLOWED_ENDPOINTS }}
            api.openai.com:443
            chatgpt.com:443
            persistent.oaistatic.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          install-tools: "false"

      - name: Deploy dotfiles
        shell: bash
        run: |
          mise use -g dotter
          rm -rf "$HOME/.config"
          mise run deploy:apply

      - name: Install global mise toolset
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: time mise install

      - name: Sync vendored dependencies
        run: mise run deploy:sync:config

      - name: Validate dotfiles configurations
        run: mise run validate:all

  # ==============================================================================
  # Stage 2: Performance regression gate
  # ==============================================================================

  performance:
    name: Performance
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: [guard, fmt, lint, security, docs]

    permissions:
      contents: read
      pull-requests: write # Required to post the performance report comment on PRs

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            ${{ env.MISE_LOCAL_ALLOWED_ENDPOINTS }}
            cache.nixos.org:443
            releases.nixos.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}
          install-tools: "false"

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install benchmark shells
        run: nix profile add "${NIXPKGS}#bash" "${NIXPKGS}#zsh"

      - name: Install benchmark dependencies
        run: mise install hyperfine jq nushell powershell tmux vendir

      - name: Compare performance with baseline
        id: benchmark
        continue-on-error: true
        env:
          PERFORMANCE_REPORT: performance-report.md
        run: mise run bench:ci

      - name: Add performance job summary
        if: always()
        run: |
          if [[ -f performance-report.md ]]; then
            cat performance-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Performance report"
              echo
              echo "**Failed:** benchmark did not produce a report."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish performance report
        if: always() && github.event_name == 'pull_request' && needs.guard.outputs.trusted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ ! -f performance-report.md ]]; then
            printf '## Performance report\n\n**Failed:** benchmark did not produce a report.\n' >performance-report.md
          fi
          # Sticky PR comment: update the existing marked comment or create a new one.
          marker="performance-regression"
          body="$(cat performance-report.md)"
          comment_id="$(
            gh api "repos/${GH_REPO}/issues/${GH_PR_NUMBER}/comments" --paginate \
              --jq '.[] | select(.body | contains("<!-- '"${marker}"' -->")) | .id' | head -n 1
          )"
          full_body="${body}"$'\n\n'"<!-- ${marker} -->"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${comment_id}" -f body="$full_body" >/dev/null
          else
            gh api -X POST "repos/${GH_REPO}/issues/${GH_PR_NUMBER}/comments" -f body="$full_body" >/dev/null
          fi

      - name: Enforce performance gate
        if: always() && steps.benchmark.outcome == 'failure'
        run: |
          echo "::error title=Performance regression gate failed::See the report below and in the job summary."
          if [[ -f performance-report.md ]]; then
            cat performance-report.md >&2
          else
            echo "Performance report was not generated." >&2
          fi
          exit 1

  # # ==============================================================================
  # # Stage 2: Attest Build Provenance
  # # ==============================================================================
