  #         subject-path: docs-build.tar.gz
  #         sbom-path: sbom.spdx.json

  # ==============================================================================
  # Stage 3: Cloudflare Preflight
  # ==============================================================================
  cf-preflight:
    name: Cloudflare Preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: [guard, fmt, lint, security, antivirus, docs, validate, performance]

    if: |
      needs.guard.outputs.trusted == 'true' &&
      github.event_name != 'schedule' &&
      github.actor != 'dependabot[bot]'

    outputs:
      enabled: ${{ steps.check.outputs.enabled }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            mise-versions.jdx.dev:443
            *.cloudfront.docker.com:443
            jdx.dev:443
            *.jdx.dev:443
            *.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Cloudflare configuration
        id: check
        env:
          ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && vars.CF_PAGES_PROJECT != '' }}
        run: echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

  # ==============================================================================
  # Stage 3: Deploy Cloudflare Pages
  # ==============================================================================
  deploy-cf-pages:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: needs.guard.outputs.trusted == 'true' && needs.cf-preflight.outputs.enabled == 'true'
    needs: [guard, cf-preflight]

    permissions:
      pull-requests: write # Required to post the Cloudflare Pages preview URL comment on PRs

    env:
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            ${{ env.MISE_LOCAL_ALLOWED_ENDPOINTS }}
            api.cloudflare.com:443
            sparrow.cloudflare.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}

      - name: Download docs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-cloudflare-pages
          path: docs/dist

      - name: Deploy preview (pull request)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: mise run deploy:cloudflare:preview

      - name: Deploy production (main)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: mise run deploy:cloudflare:production

      - name: Update sticky PR comment
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Sticky PR comment: update the existing marked comment or create a new one.
          marker="cloudflare-preview"
          body="## Cloudflare Pages Preview"$'\n\n'"Deployed: https://pr-${GH_PR_NUMBER}.${CF_PAGES_PROJECT}.pages.dev"
          comment_id="$(
            gh api "repos/${GH_REPO}/issues/${GH_PR_NUMBER}/comments" --paginate \
              --jq '.[] | select(.body | contains("<!-- '"${marker}"' -->")) | .id' | head -n 1
          )"
          full_body="${body}"$'\n\n'"<!-- ${marker} -->"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${comment_id}" -f body="$full_body" >/dev/null
          else
            gh api -X POST "repos/${GH_REPO}/issues/${GH_PR_NUMBER}/comments" -f body="$full_body" >/dev/null
          fi

  # ==============================================================================
  # Stage 3: Deploy to GitHub Pages
  # ==============================================================================
  deploy-github-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    if: needs.guard.outputs.trusted == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    needs: [guard, cf-preflight]

    permissions:
      pages: write # Required to deploy the docs site to GitHub Pages
      id-token: write # Required for OIDC authentication to GitHub Pages

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            *.github.com:443
            *.cloudfront.docker.com:443
            *.blob.core.windows.net:443
            mise-versions.jdx.dev:443
            jdx.dev:443
            *.jdx.dev:443
            *.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          artifact_name: docs-github-pages
