name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read # Default read-only for all jobs

defaults:
  run:
    shell: bash

env:
  NIXPKGS: github:NixOS/nixpkgs/nixos-unstable
  MISE_VERSION: v2026.7.17
  MISE_SHA256: 71b4a7720cf8f1e22adbc31fed6f0094e84b16d6e365a19c4afae354f1493b3a # mise-v2026.7.17-linux-x64-musl.tar.gz
  MISE_DATA_DIR: ${{ github.workspace }}/.tools/mise
  MISE_INSTALL_PATH: ${{ github.workspace }}/.tools/mise/bin/mise
  DPRINT_CACHE_DIR: ${{ github.workspace }}/.tools/dprint
  MISE_LOCAL_ALLOWED_ENDPOINTS: >-
    *.blob.core.windows.net:443
    github.com:443
    api.osv.dev:443
    *.cloudfront.docker.com:443
    *.github.com:443
    files.pythonhosted.org:443
    nodejs.org:443
    objects.githubusercontent.com:443
    pypi.org:443
    registry.npmjs.org:443
    release-assets.githubusercontent.com:443
    plugins.dprint.dev:443
    mise-versions.jdx.dev:443
    jdx.dev:443
    *.jdx.dev:443
    *.sigstore.dev:443
  VALIDATE_MISE_INSTALL_ALLOWED_ENDPOINTS: >-
    crates.io:443
    dl.google.com:443
    formulae.brew.sh:443
    go.dev:443
    golang.org:443
    index.crates.io:443
    models.dev:443
    packages.microsoft.com:443
    raw.githubusercontent.com:443
    static.crates.io:443
    static.rust-lang.org:443
    ziglang.org:443
    zig.karearl.com:443
    zig.linus.dev:443
    ziglang.freetls.fastly.net:443
    zigmirror.com:443
    builds.zigtools.org:443
    zig.mirror.mschae23.de:443
    fs.liujiacai.net:443
    zig.tilok.dev:443
    zig.bcr.ist:443
    pkg.hexops.org:443
    storage.googleapis.com:443
    conda.anaconda.org:443
    proxy.golang.org:443
    sum.golang.org:443

jobs:
  # ==============================================================================
  # Stage 1: Format Quality Gate
  # ==============================================================================
  fmt:
    name: Format
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            ${{ env.MISE_LOCAL_ALLOWED_ENDPOINTS }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}

      - name: Format checks
        run: mise run fmt:all

  # ==============================================================================
  # Stage 1: Lint Quality Gate
  # ==============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            ${{ env.MISE_LOCAL_ALLOWED_ENDPOINTS }}
            api.cloudflare.com:443
            starship.rs:443
            *.starship.rs:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}

      - name: Lint checks
        run: mise run lint:all

  # ==============================================================================
  # Stage 1: Security
  # ==============================================================================
  security:
    name: Security
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    permissions:
      contents: read # Default read-only for this job
      security-events: write # Required to upload security scan results to GitHub Security tab.

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            ${{ env.MISE_LOCAL_ALLOWED_ENDPOINTS }}
            api.cloudflare.com:443
            ghcr.io:443
            mirror.gcr.io:443
            pkg-containers.githubusercontent.com:443
            semgrep.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}

      - name: Restore Trivy cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-${{ runner.os }}-

      - name: Secret scanning
        run: mise run security:trufflehog

      - name: SAST scan
        run: mise run security:semgrep

      - name: Trivy filesystem scan
        run: mise run security:trivy:table

      - name: Trivy SARIF
        if: always()
        continue-on-error: true
        run: mise run security:trivy:sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        if: ${{ always() && hashFiles('.tools/trivy/trivy-results.sarif') != '' }}
        with:
          sarif_file: .tools/trivy/trivy-results.sarif

  # ==============================================================================
  # Stage 1: Antivirus
  # ==============================================================================
  antivirus:
    name: Antivirus
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            ${{ env.MISE_LOCAL_ALLOWED_ENDPOINTS }}
            *.cloudflarestorage.com:443
            auth.docker.io:443
            database.clamav.net:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}

      - name: Get current date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore ClamAV database cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/clamav-db
          key: clamav-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            clamav-${{ runner.os }}-

      - name: Update ClamAV database and scan for malware
        run: mise run antivirus:all

  # ==============================================================================
  # Stage 1: Documentation Gate
  # ==============================================================================
  docs:
    name: Documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            ${{ env.MISE_LOCAL_ALLOWED_ENDPOINTS }}
            specifications.freedesktop.org:443
            www.nushell.sh:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}

      - name: Restore aube cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/aube/store
          key: ${{ runner.os }}-aube-${{ hashFiles('docs/aube-workspace.yaml', 'docs/aube-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/lychee/.lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: |
            lychee-

      - name: Install docs dependencies
        env:
          MISE_CONFIG_DIR: ${{ github.workspace }}/dotfiles/.config/mise
        run: mise run docs:install

      - name: Audit docs dependencies
        env:
          MISE_CONFIG_DIR: ${{ github.workspace }}/dotfiles/.config/mise
        run: mise run docs:audit

      - name: Build docs (Cloudflare Pages)
        env:
          MISE_CONFIG_DIR: ${{ github.workspace }}/dotfiles/.config/mise
          CI_BASE_URL: /
        run: mise run docs:build

      - name: Link Check
        env:
          MISE_CONFIG_DIR: ${{ github.workspace }}/dotfiles/.config/mise
        run: mise run docs:links

      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-cloudflare-pages
          path: docs/dist

      - name: Build docs (GitHub Pages)
        env:
          MISE_CONFIG_DIR: ${{ github.workspace }}/dotfiles/.config/mise
          CI_BASE_URL: /dotfiles/
        run: mise run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: docs-github-pages
          path: docs/dist

  # ==============================================================================
  # Stage 2: Validate dotfiles configurations
  # ==============================================================================
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [fmt, lint, security, docs]
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          # - macos-26
          # - windows-2025

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            ${{ env.MISE_LOCAL_ALLOWED_ENDPOINTS }}
            ${{ env.VALIDATE_MISE_INSTALL_ALLOWED_ENDPOINTS }}
            archive.ubuntu.com:443
            azure.archive.ubuntu.com:443
            security.ubuntu.com:443
            api.openai.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          install-tools: "false"

      - name: Install Stow
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y stow

      - name: Deploy dotfiles
        shell: bash
        run: stow -v --adopt --target="$HOME" dotfiles

      - name: Install global mise toolset
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: time mise install

      - name: Sync vendored dependencies
        run: vendir sync --locked

      - name: Validate dotfiles configurations
        run: mise run validate:all

  # ==============================================================================
  # Stage 2: Performance regression gate
  # ==============================================================================

  performance:
    name: Performance
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: [fmt, lint, security, docs]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      pull-requests: write # Required to post the performance report comment on PRs

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            github.com:443
            *.cloudfront.docker.com:443
            *.github.com:443
            cache.nixos.org:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            mise-versions.jdx.dev:443
            jdx.dev:443
            *.jdx.dev:443
            *.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ github.job }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Install benchmark dependencies
        run: |
          nix profile install \
            "$NIXPKGS#just" \
            "$NIXPKGS#hyperfine" \
            "$NIXPKGS#bash" \
            "$NIXPKGS#zsh" \
            "$NIXPKGS#nushell" \
            "$NIXPKGS#tmux" \
            "$NIXPKGS#vendir" \
            "$NIXPKGS#jq"

      - name: Compare performance with baseline
        id: benchmark
        continue-on-error: true
        env:
          PERFORMANCE_REPORT: performance-report.md
        run: just bench ci

      - name: Add performance job summary
        if: always()
        run: |
          if [[ -f performance-report.md ]]; then
            cat performance-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Performance report"
              echo
              echo "**Failed:** benchmark did not produce a report."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish performance report
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ ! -f performance-report.md ]]; then
            printf '## Performance report\n\n**Failed:** benchmark did not produce a report.\n' >performance-report.md
          fi
          # Sticky PR comment: update the existing marked comment or create a new one.
          marker="performance-regression"
          body="$(cat performance-report.md)"
          comment_id="$(
            gh api "repos/${GH_REPO}/issues/${GH_PR_NUMBER}/comments" --paginate \
              --jq '.[] | select(.body | contains("<!-- '"${marker}"' -->")) | .id' | head -n 1
          )"
          full_body="${body}"$'\n\n'"<!-- ${marker} -->"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${comment_id}" -f body="$full_body" >/dev/null
          else
            gh api -X POST "repos/${GH_REPO}/issues/${GH_PR_NUMBER}/comments" -f body="$full_body" >/dev/null
          fi

      - name: Enforce performance gate
        if: always() && steps.benchmark.outcome == 'failure'
        run: |
          echo "::error title=Performance regression gate failed::See the report below and in the job summary."
          if [[ -f performance-report.md ]]; then
            cat performance-report.md >&2
          else
            echo "Performance report was not generated." >&2
          fi
          exit 1

  # ==============================================================================
  # Stage 2: Attest Build Provenance
  # ==============================================================================
  attest:
    name: Attest Build
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: docs
    if: github.event_name != 'pull_request'

    permissions:
      attestations: write # Required to create artifact attestations
      contents: read # Required to download the build artifact
      id-token: write # Required by Sigstore to sign attestations via OIDC

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            *.github.com:443
            *.cloudfront.docker.com:443
            *.blob.core.windows.net:443
            *.sigstore.dev:443
            get.anchore.io:443
            release-assets.githubusercontent.com:443
            starship.rs:443
            *.starship.rs:443
            mise-versions.jdx.dev:443
            jdx.dev:443
            *.jdx.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download docs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-cloudflare-pages
          path: docs/dist

      - name: Package docs output
        run: tar -czf docs-build.tar.gz -C docs/dist .

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: docs-build.tar.gz

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: docs/dist
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: docs-build.tar.gz
          sbom-path: sbom.spdx.json

  # ==============================================================================
  # Stage 3: Cloudflare Preflight
  # ==============================================================================
  cf-preflight:
    name: Cloudflare Preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: [fmt, lint, security, antivirus, docs, validate, performance]

    if: |
      github.event_name != 'schedule' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true)

    outputs:
      enabled: ${{ steps.check.outputs.enabled }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            mise-versions.jdx.dev:443
            *.cloudfront.docker.com:443
            jdx.dev:443
            *.jdx.dev:443
            *.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Cloudflare configuration
        id: check
        env:
          ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && vars.CF_PAGES_PROJECT != '' }}
        run: echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

  # ==============================================================================
  # Stage 3: Deploy Cloudflare Pages
  # ==============================================================================
  deploy-cf-pages:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: needs.cf-preflight.outputs.enabled == 'true'
    needs: cf-preflight

    permissions:
      pull-requests: write # Required to post the Cloudflare Pages preview URL comment on PRs

    env:
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            ${{ env.MISE_LOCAL_ALLOWED_ENDPOINTS }}
            api.cloudflare.com:443
            sparrow.cloudflare.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}

      - name: Download docs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-cloudflare-pages
          path: docs/dist

      - name: Deploy preview (pull request)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          wrangler pages deploy docs/dist \
            --project-name="${CF_PAGES_PROJECT}" \
            --branch="pr-${PR_NUMBER}" \
            --commit-dirty=true

      - name: Deploy production (main)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages deploy docs/dist \
            --project-name="${CF_PAGES_PROJECT}" \
            --commit-dirty=true

      - name: Update sticky PR comment
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Sticky PR comment: update the existing marked comment or create a new one.
          marker="cloudflare-preview"
          body="## Cloudflare Pages Preview"$'\n\n'"Deployed: https://pr-${GH_PR_NUMBER}.${CF_PAGES_PROJECT}.pages.dev"
          comment_id="$(
            gh api "repos/${GH_REPO}/issues/${GH_PR_NUMBER}/comments" --paginate \
              --jq '.[] | select(.body | contains("<!-- '"${marker}"' -->")) | .id' | head -n 1
          )"
          full_body="${body}"$'\n\n'"<!-- ${marker} -->"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${comment_id}" -f body="$full_body" >/dev/null
          else
            gh api -X POST "repos/${GH_REPO}/issues/${GH_PR_NUMBER}/comments" -f body="$full_body" >/dev/null
          fi

  # ==============================================================================
  # Stage 3: Deploy to GitHub Pages
  # ==============================================================================
  deploy-github-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    needs: cf-preflight

    permissions:
      pages: write # Required to deploy the docs site to GitHub Pages
      id-token: write # Required for OIDC authentication to GitHub Pages

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            *.github.com:443
            *.cloudfront.docker.com:443
            *.blob.core.windows.net:443
            mise-versions.jdx.dev:443
            jdx.dev:443
            *.jdx.dev:443
            *.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          artifact_name: docs-github-pages
