  #         egress-policy: block
  #         allowed-endpoints: >-
  #           github.com:443
  #           *.github.com:443
  #           *.cloudfront.docker.com:443
  #           *.blob.core.windows.net:443
  #           *.sigstore.dev:443
  #           get.anchore.io:443
  #           release-assets.githubusercontent.com:443
  #           starship.rs:443
  #           *.starship.rs:443
  #           mise-versions.jdx.dev:443
  #           jdx.dev:443
  #           *.jdx.dev:443

  #     - name: Checkout
  #       uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
