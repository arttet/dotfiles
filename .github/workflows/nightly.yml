name: Nightly

on:
  schedule:
    - cron: "30 2 * * *" # Daily at 02:30 UTC, after the CI nightly run
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read # Default read-only for all jobs

defaults:
  run:
    shell: bash

env:
  MISE_VERSION: v2026.10.8
  MISE_DATA_DIR: ${{ github.workspace }}/.tools/mise

jobs:
  vendir-status:
    name: Vendir Lock Refresh
    runs-on: ubuntu-26.04
    timeout-minutes: 360

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            github.com:443
            production.cloudfront.docker.com:443
            *.cloudfront.docker.com:443
            *.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            mise-versions.jdx.dev:443
            jdx.dev:443
            *.jdx.dev:443
            tuf-repo-cdn.sigstore.dev:443
            *.sigstore.dev:443
            raw.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: ${{ env.MISE_VERSION }}
          install: false

      - name: Install tools
        run: mise install vendir nushell jq yq

      - name: Add dependency status summary
        run: mise run deps:vendir:summary >>"$GITHUB_STEP_SUMMARY"

  # ==============================================================================
  # Antivirus Gate: Full malware scan
  # ==============================================================================
  antivirus:
    name: Antivirus
    runs-on: ubuntu-26.04
    timeout-minutes: 360

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            *.cloudflarestorage.com:443
            *.cloudfront.docker.com:443
            *.github.com:443
            *.jdx.dev:443
            *.sigstore.dev:443
            raw.githubusercontent.com:443
            api.osv.dev:443
            auth.docker.io:443
            crates.io:443
            database.clamav.net:443
            files.pythonhosted.org:443
            github.com:443
            jdx.dev:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            objects.githubusercontent.com:443
            production.cloudflare.docker.com:443
            pypi.org:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: ${{ env.MISE_VERSION }}
          install: false

      - name: Install the full toolset so the scan has something to look at
        run: mise install

      - name: Update ClamAV database and scan everything
        run: mise run antivirus:all

  # ==============================================================================
  # Security Gate: Container Images Scan
  # ==============================================================================
  images:
    name: Container Images Scan
    runs-on: ubuntu-26.04
    timeout-minutes: 360

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            *.cloudflarestorage.com:443
            *.cloudfront.docker.com:443
            *.github.com:443
            *.jdx.dev:443
            *.sigstore.dev:443
            raw.githubusercontent.com:443
            auth.docker.io:443
            github.com:443
            grype.anchore.io:443
            jdx.dev:443
            mise-versions.jdx.dev:443
            objects.githubusercontent.com:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            toolbox-data.anchore.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: ${{ env.MISE_VERSION }}
          install: false

      - name: Install tools
        run: mise install grype

      - name: Scan the pinned container images
        run: mise run security:grype:images

  # ==============================================================================
  # Security Gate: OpenSSF Scorecard
  # ==============================================================================
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-26.04
    timeout-minutes: 360

    permissions:
      contents: read
      actions: read # Required by Scorecard to read workflow run data.
      id-token: write # Required to publish the signed results to the public dataset.
      security-events: write # Required to upload the SARIF report to the GitHub Security tab.

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            *.sigstore.dev:443
            raw.githubusercontent.com:443
            api.deps.dev:443
            api.github.com:443
            api.osv.dev:443
            api.securityscorecards.dev:443
            bestpractices.coreinfrastructure.org:443
            github.com:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            sigstore-tuf-root.storage.googleapis.com:443
            uploads.github.com:443
            www.bestpractices.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecard-results.sarif
