name: Nightly

on:
  schedule:
    - cron: "30 2 * * *" # Daily at 02:30 UTC, after the CI nightly run
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read # Default read-only for all jobs

defaults:
  run:
    shell: bash

env:
  MISE_VERSION: v2026.7.17
  MISE_SHA256: 71b4a7720cf8f1e22adbc31fed6f0094e84b16d6e365a19c4afae354f1493b3a # mise-v2026.7.17-linux-x64-musl.tar.gz
  MISE_DATA_DIR: ${{ github.workspace }}/.tools/mise
  MISE_INSTALL_PATH: ${{ github.workspace }}/.tools/mise/bin/mise

jobs:
  vendir-status:
    name: Vendir Lock Refresh
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            github.com:443
            production.cloudfront.docker.com:443
            *.cloudfront.docker.com:443
            *.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            mise-versions.jdx.dev:443
            jdx.dev:443
            *.jdx.dev:443
            tuf-repo-cdn.sigstore.dev:443
            *.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}
          install-tools: "false"

      # Only what `just vendir outdated-summary` needs; the full toolset would pull npm and pypi endpoints.
      - name: Install tools
        run: mise install just vendir jq yq

      - name: Add dependency status summary
        run: mise exec -- just vendir outdated-summary >>"$GITHUB_STEP_SUMMARY"

  # ==============================================================================
  # Container images pinned for CI
  # ==============================================================================
  # Pinning by digest freezes the bytes, not the vulnerabilities found in them later. This runs
  # nightly rather than per pull request because the digests do not change between commits — only the
  # vulnerability data does.
  images:
    name: Container Images
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            *.cloudflarestorage.com:443
            *.cloudfront.docker.com:443
            *.github.com:443
            *.jdx.dev:443
            *.sigstore.dev:443
            auth.docker.io:443
            ghcr.io:443
            github.com:443
            grype.anchore.io:443
            jdx.dev:443
            mise-versions.jdx.dev:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            toolbox-data.anchore.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise
        with:
          version: ${{ env.MISE_VERSION }}
          sha256: ${{ env.MISE_SHA256 }}
          install-tools: "false"

      - name: Install tools
        run: mise install grype

      - name: Scan the pinned container images
        run: mise run security:grype:images

  # ==============================================================================
  # OpenSSF Scorecard
  # ==============================================================================
  # Report-only by design: several checks (Branch-Protection above all) need an admin-scoped PAT to
  # return anything meaningful, and failing the build on an inconclusive score teaches nothing.
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    permissions:
      contents: read
      actions: read # Required by Scorecard to read workflow run data.
      id-token: write # Required to publish the signed results to the public dataset.
      security-events: write # Required to upload the SARIF report to the GitHub Security tab.

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            *.sigstore.dev:443
            api.deps.dev:443
            api.github.com:443
            api.osv.dev:443
            api.securityscorecards.dev:443
            bestpractices.coreinfrastructure.org:443
            github.com:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            sigstore-tuf-root.storage.googleapis.com:443
            uploads.github.com:443
            www.bestpractices.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: scorecard-results.sarif
