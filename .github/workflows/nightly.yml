name: Nightly

on:
  schedule:
    - cron: "30 2 * * *" # Daily at 02:30 UTC, after the CI nightly run
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read # Default read-only for all jobs

defaults:
  run:
    shell: bash

env:
  NIXPKGS: github:NixOS/nixpkgs/nixos-unstable

jobs:
  vendir-status:
    name: Vendir Lock Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ github.job }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Download tools
        run: nix profile install "$NIXPKGS#just" "$NIXPKGS#vendir" "$NIXPKGS#yq-go" "$NIXPKGS#jq"

      - name: Add dependency status summary
        run: just vendir outdated-summary >>"$GITHUB_STEP_SUMMARY"
