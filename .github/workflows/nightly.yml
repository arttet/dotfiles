name: Nightly

on:
  schedule:
    - cron: "30 2 * * *" # Daily at 02:30 UTC, after the CI nightly run
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read # Default read-only for all jobs

defaults:
  run:
    shell: bash

env:
  NIXPKGS: github:NixOS/nixpkgs/nixos-unstable

jobs:
  vendir-status:
    name: Vendir Lock Refresh
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load allowed endpoints
        id: endpoints
        run: |
          allowed="$(grep -hvE '^\s*(#|$)' .github/harden-runner/nix.txt | xargs)"
          echo "list=${allowed}" >> "$GITHUB_OUTPUT"

      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: ${{ steps.endpoints.outputs.list }}

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ github.job }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Download tools
        run: nix profile install "$NIXPKGS#just" "$NIXPKGS#vendir" "$NIXPKGS#yq-go" "$NIXPKGS#jq"

      - name: Add dependency status summary
        run: just vendir outdated-summary >>"$GITHUB_STEP_SUMMARY"
