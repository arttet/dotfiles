# Minimal Stage-2 bootstrap. This is used only before deploy; deployed global mise
# configuration remains the source of truth for interactive use and validation.
[tool_alias]
herdrw = "github:ogulcancelik/herdr"

[tools]
node = "26.5.1"
go = "1.26.5"
aube = "1.34.0"
just = "1.57.0"
"aqua:carvel-dev/vendir" = "0.46.0"
"aqua:nushell/nushell" = "0.114.1"
"cargo:dotter" = "0.13.5"
claude-code = "2.1.220"
codex = "0.145.0"
opencode = "1.18.9"
helix = "25.07.1"
neovim = "0.12.4"
herdr = { version = "0.7.5", os = ["linux", "macos"] }
herdrw = { version = "preview-2026-07-21-0f10e1453a7f", os = ["windows"] }
starship = "1.26.0"
tmux = { version = "3.7b", os = ["linux", "macos"] }
yazi = "26.5.6"
zellij = "0.44.3"
"npm:@moonshot-ai/kimi-code" = "0.29.2"
"npm:@upstash/context7-mcp" = "3.2.5"
"npm:@playwright/mcp" = "0.0.78"
"npm:@eargollo/vikunja-mcp" = { version = "1.2.1", allow_low_downloads = true }
"pipx:serena-agent" = "1.6.1"
"pipx:graphifyy[mcp]" = "0.9.28"

[tools."github:PowerShell/PowerShell"]
version = "7.6.4"
version_prefix = "v"
bin_path = "."

[tools."github:PowerShell/PowerShell".platforms]
linux-x64 = { asset_pattern = "PowerShell-{{ version }}-linux-x64.tar.gz" }
macos-x64 = { asset_pattern = "PowerShell-{{ version }}-osx-x64.tar.gz" }
macos-arm64 = { asset_pattern = "PowerShell-{{ version }}-osx-arm64.tar.gz" }
windows-x64 = { asset_pattern = "PowerShell-{{ version }}-win-x64.zip" }
