[helpers]

# =============================================================================
# Profile Groups
# =============================================================================

[default]
depends = ["agent", "dev", "editor", "shell", "terminal"]

[agent]
depends = ["claude", "codex", "kimi", "opencode"]

[dev]
depends = ["mise"]

[editor]
depends = ["helix", "zed"]

[shell]
depends = ["bash", "powershell", "zsh"]

[terminal]
depends = ["alacritty", "windows-terminal"]

# =============================================================================
# Base Configuration
# =============================================================================

[default.files]
"dotfiles/.config" = "~/.config"

# =============================================================================
# Tools
# =============================================================================

# =============================================================================
# Terminal Emulators
# =============================================================================

[alacritty]
depends = []

[alacritty.files]
"dotfiles/.config/alacritty/alacritty.toml" = { target = "~\\AppData\\Roaming\\alacritty\\alacritty.toml", if = "dotter.windows" }

[windows-terminal]
depends = []

[windows-terminal.files]
"dotfiles/.config/windows-terminal/fragments/dotfiles.json" = { target = "~\\AppData\\Local\\Microsoft\\Windows Terminal\\Fragments\\dotfiles\\dotfiles.json", if = "dotter.windows" }

# =============================================================================
# Text Editors
# =============================================================================

[helix]
depends = []

[helix.files]
"dotfiles/.config/helix/config.toml" = { target = "~\\AppData\\Roaming\\helix\\config.toml", if = "dotter.windows" }
"dotfiles/.config/helix/languages.toml" = { target = "~\\AppData\\Roaming\\helix\\languages.toml", if = "dotter.windows" }

[zed]
depends = []

[zed.files]
"dotfiles/.config/zed/settings.json" = { target = "~\\AppData\\Roaming\\Zed\\settings.json", if = "dotter.windows" }

# =============================================================================
# AI Tools
# =============================================================================

[claude]
depends = []

[claude.files]
"dotfiles/.config/claude/CLAUDE.md" = "~/.config/claude/CLAUDE.md"
"dotfiles/.config/claude/keybindings.json" = "~/.config/claude/keybindings.json"
"dotfiles/.config/claude/settings.json" = "~/.config/claude/settings.json"
"dotfiles/.config/claude/statusline.sh" = "~/.config/claude/statusline.sh"

[codex]
depends = []

[codex.files]
"dotfiles/.config/codex/config.toml" = "~/.config/codex/config.toml"
"dotfiles/.config/codex/AGENTS.md" = "~/.config/codex/AGENTS.md"
"dotfiles/.config/codex/rules/default.rules" = "~/.config/codex/rules/default.rules"

[kimi]
depends = []

[kimi.files]
"dotfiles/.config/kimi-code/AGENTS.md" = "~/.config/kimi-code/AGENTS.md"
"dotfiles/.config/kimi-code/config.toml" = "~/.config/kimi-code/config.toml"
"dotfiles/.config/kimi-code/tui.toml" = "~/.config/kimi-code/tui.toml"
"dotfiles/.config/kimi-code/mcp.json" = "~/.config/kimi-code/mcp.json"
"dotfiles/.config/kimi-code/themes/nord.json" = "~/.config/kimi-code/themes/nord.json"

[opencode]
depends = []

[opencode.files]
"dotfiles/.config/opencode/AGENTS.md" = "~/.config/opencode/AGENTS.md"
"dotfiles/.config/opencode/opencode.jsonc" = "~/.config/opencode/opencode.jsonc"
"dotfiles/.config/opencode/tui.json" = "~/.config/opencode/tui.json"

# =============================================================================
# Shells
# =============================================================================

[mise]
depends = []

[mise.files]
"dotfiles/.config/mise/config.toml" = "~/.config/mise/config.toml"
"dotfiles/.config/mise/conf.d" = "~/.config/mise/conf.d"

[bash]
depends = []

[bash.files]
"dotfiles/.bash_profile" = "~/.bash_profile"
"dotfiles/.bashrc" = "~/.bashrc"

[powershell]
depends = []

[powershell.files]
"dotfiles/.config/powershell/profile.ps1" = { target = "~\\OneDrive\\Documents\\PowerShell\\Microsoft.PowerShell_profile.ps1", if = "dotter.windows" }

[zsh]
depends = []

[zsh.files]
"dotfiles/.zshenv" = "~/.zshenv"

# =============================================================================
# Desktop
# =============================================================================

[wallpapers]
depends = []

[wallpapers.files]
"dotfiles/.local/share/backgrounds" = "~/.local/share/backgrounds"

# =============================================================================
# Settings
# =============================================================================

[settings]
default_target_type = "symbolic"
