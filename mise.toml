"""

[tasks."bench:all"]
description = "Run every benchmark, one shell at a time"
run = [
  { task = "bench:nu" },
  { task = "bench:bash" },
  { task = "bench:zsh" },
  { task = "bench:pwsh" },
  { task = "bench:tmux" },
]

[tasks."bench:profile:bash"]
# Diagnostic, not a gate: bench:ci is untouched and this never runs in CI. The gate catches a startup
# time getting worse; this one answers which fragment to look at, which the gate never says.
#
# Run by nu rather than bash: mise hands a bash task a POSIX-style PATH, and nu cannot resolve the
# hyperfine shim through it on Windows. The other bench:* tasks carry the same workaround.
description = "Attribute Bash startup cost to individual configuration fragments"
shell = "nu -c"
env = { HOME = "{{config_root}}/dotfiles", XDG_CONFIG_HOME = "{{config_root}}/dotfiles/.config" }
run = "nu misc/nu/shell-profile.nu bash --hyperfine '{{vars.hyperfine}}'"

[tasks."bench:profile:zsh"]
description = "Attribute Zsh startup cost to individual configuration fragments"
shell = "nu -c"
env = { HOME = "{{config_root}}/dotfiles", XDG_CONFIG_HOME = "{{config_root}}/dotfiles/.config" }
run = "nu misc/nu/shell-profile.nu zsh --hyperfine '{{vars.hyperfine}}'"

[tasks."bench:profile"]
description = "Attribute startup cost to configuration fragments for every profiled shell"
run = [{ task = "bench:profile:bash" }, { task = "bench:profile:zsh" }]

[tasks."bench:collect"]
description = "Aggregate the benchmark exports into a report input"
run = """
jq -s '{results: [.[].results[]]}' {{vars.bench_runs}}/*.json >{{vars.bench_dir}}/results.json
for export in {{vars.bench_runs}}/*.md; do
  printf '### %s\\n\\n' "$(basename "$export" .md)"
  cat "$export"
  printf '\\n'
done >{{vars.bench_dir}}/tables.md
"""

[tasks."bench:report"]
description = "Compare the collected runs with the committed baseline and fail on a regression"
run = [
  "{{vars.bench_report}} --arg mode check >{{vars.bench_dir}}/report.json",
  "jq -r '.report' {{vars.bench_dir}}/report.json | tee \"${PERFORMANCE_REPORT:-performance-report.md}\"",
  "jq -e '.passed' {{vars.bench_dir}}/report.json >/dev/null",
]

[tasks."bench:ci"]
# One attempt. Absorbing runner noise is the workflow's job: it wraps this in retry(1), which comes from
# nixpkgs alongside the benchmark shells rather than from the mise toolset.
description = "Measure startup, collect the runs and compare with the baseline [run deploy:sync:config first]"
run = [
  { task = "bench:all" },
  { task = "bench:collect" },
  { task = "bench:report" },
]

[tasks."bench:update"]
description = "Regenerate the performance baseline [run on the platform the gate runs on]"
run = [
  { task = "deploy:sync:config" },
  { task = "bench:all" },
  { task = "bench:collect" },
  "{{vars.bench_report}} --arg mode update >{{vars.bench_dir}}/report.json",
  "jq '.baseline' {{vars.bench_dir}}/report.json >{{vars.bench_dir}}/baseline.json",
  "mv -- {{vars.bench_dir}}/baseline.json misc/baseline.json",
]

# ==============================================================================
# Stage 3: Artifact Gate
# ==============================================================================

[tasks."artifact:setup"]
description = "Create the artifact output directories"
run = "mkdir -p {{vars.artifact_dir}}/dotfiles {{vars.artifact_dir}}/wallpapers"

[tasks."artifact:all"]
description = "Build both release sets"
run = [{ task = "artifact:dotfiles:all" }, { task = "artifact:wallpapers:all" }]

# ==============================================================================
# Stage 3: Dotfiles Artifact Gate
# ==============================================================================

[tasks."artifact:dotfiles:clean"]
description = "Remove the dotfiles release set"
run = "rm -rf {{vars.artifact_dir}}/dotfiles"

[tasks."artifact:dotfiles:components"]
description = "List the vendored components of the dotfiles set with their origins"
depends = ["artifact:setup"]
run = """
yq -o=json --from-file misc/jq/components.yq vendir.yml \
  >{{vars.artifact_dir}}/components.json
"""

[tasks."artifact:dotfiles:files"]
description = "Enumerate the vendored half of the archive [run deploy:sync:config first]"
depends = ["artifact:dotfiles:components"]
env = { ARTIFACT_DIR = "{{vars.artifact_dir}}" }
run = """
jq -r '.[].path' "${ARTIFACT_DIR}/components.json" | tr -d '\\r' \
  | xargs -I{} find {} -type f -print0 \
  | sort -z -u >"${ARTIFACT_DIR}/vendored.files"
"""

[tasks."artifact:dotfiles:pack:tracked"]
# git archive stamps every entry with uid/gid 0 and the commit time on its own, so the reproducibility
# flags the vendored half still needs are absent here by design, not by omission.
#
# It also packs HEAD rather than the working tree, which is what manifest.json has always claimed:
# a dirty checkout can no longer ship edits under a commit id that does not contain them.
description = "Pack the tracked half of the archive from the commit"
# Runs before the vendored half, so it cannot rely on that chain having created the output directory.
depends = ["artifact:setup"]
run = """
git archive --format=tar HEAD -- {{vars.artifact_tracked}} \
  >"${ARTIFACT_DIR}/tracked.tar"
"""

[tasks."artifact:dotfiles:pack:tracked".env]
ARTIFACT_DIR = "{{vars.artifact_dir}}"

[tasks."artifact:dotfiles:pack:vendored"]
description = "Pack the vendored half of the archive reproducibly"
depends = ["artifact:dotfiles:files"]
run = """
tar --create --no-recursion --null --files-from="${ARTIFACT_DIR}/vendored.files" \
  --format=posix --owner=0 --group=0 --numeric-owner \
  --mtime="@${SOURCE_DATE_EPOCH}" \
  --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
  >"${ARTIFACT_DIR}/vendored.tar"
"""

[tasks."artifact:dotfiles:pack:vendored".env]
ARTIFACT_DIR = "{{vars.artifact_dir}}"
SOURCE_DATE_EPOCH = "{{ exec(command='git show -s --format=%ct HEAD') }}"

[tasks."artifact:dotfiles:pack"]
# The two halves are concatenated rather than merged into one sorted stream: the vendored trees are
# gitignored, so git archive cannot see them and they cannot collide with the tracked half either.
# Reproducibility needs each half to be deterministic, which they are; it does not need a global sort.
description = "Pack the dotfiles tree reproducibly"
env = { ARTIFACT_DIR = "{{vars.artifact_dir}}" }
run = [
  { task = "artifact:dotfiles:pack:tracked" },
  { task = "artifact:dotfiles:pack:vendored" },
  'tar --concatenate --file="${ARTIFACT_DIR}/tracked.tar" "${ARTIFACT_DIR}/vendored.tar"',
  'gzip -n <"${ARTIFACT_DIR}/tracked.tar" >"${ARTIFACT_DIR}/dotfiles/dotfiles.tar.gz"',
]

[tasks."artifact:dotfiles:files:text"]
# Read back out of the finished archive rather than forward from the input lists: the manifest and the
# license inventory then describe what shipped, not what was meant to ship. git archive emits directory
# entries too, and those are dropped here because both consumers expect file paths.
description = "List the archive contents, one path per line"
depends = ["artifact:dotfiles:pack"]
env = { ARTIFACT_DIR = "{{vars.artifact_dir}}" }
run = """
tar -tzf "${ARTIFACT_DIR}/dotfiles/dotfiles.tar.gz" | grep -v '/$' \
  >"${ARTIFACT_DIR}/dotfiles.files.txt"
"""

[tasks."artifact:dotfiles:sbom"]
description = "Generate an SPDX SBOM of the dotfiles archive"
depends = ["artifact:dotfiles:pack"]
env = { COMMIT = "{{ exec(command='git rev-parse HEAD') }}" }
run = """
syft scan file:{{vars.artifact_dir}}/dotfiles/dotfiles.tar.gz \
  --source-name dotfiles --source-version "${COMMIT}" \
  -o spdx-json={{vars.artifact_dir}}/dotfiles/sbom.spdx.json
"""

[tasks."artifact:dotfiles:vex"]
description = "Ship the VEX document with the dotfiles set"
depends = ["artifact:setup"]
run = "cp -- {{vars.vex_file}} {{vars.artifact_dir}}/dotfiles/vex.openvex.json"

[tasks."artifact:dotfiles:licenses"]
description = "Build the license inventory of the dotfiles set"
depends = ["security:trivy:license:scan", "artifact:dotfiles:files:text"]
run = """
jq -n -f misc/jq/licenses.jq \
  --slurpfile scan "${ARTIFACT_DIR}/licenses-scan.json" \
  --slurpfile components "${ARTIFACT_DIR}/components.json" \
  --rawfile files "${ARTIFACT_DIR}/dotfiles.files.txt" \
  >"${ARTIFACT_DIR}/dotfiles/licenses.json"
"""

[tasks."artifact:dotfiles:licenses".env]
ARTIFACT_DIR = "{{vars.artifact_dir}}"
SCAN_ROOT = "dotfiles"
LICENSES_ALLOWED = "{{vars.artifact_licenses_allowed}}"

[tasks."artifact:dotfiles:licenses:report"]
description = "Print the license warnings of the dotfiles set"
run = """
jq -r -f misc/jq/license-warnings.jq \
  {{vars.artifact_dir}}/dotfiles/licenses.json
"""

[tasks."artifact:dotfiles:manifest:hashes"]
description = "Hash the dotfiles payload files for the manifest"
depends = ["artifact:dotfiles:sbom", "artifact:dotfiles:vex", "artifact:dotfiles:licenses"]
dir = "{{vars.artifact_dir}}/dotfiles"
run = """
sha256sum dotfiles.tar.gz sbom.spdx.json vex.openvex.json licenses.json \
  >../dotfiles-hashes.txt
"""

[tasks."artifact:dotfiles:manifest".env]
ARTIFACT_DIR = "{{vars.artifact_dir}}"
ARTIFACT_SET = "dotfiles"
VENDIR_CONFIG = "vendir.yml"
VENDIR_LOCK = "{{vars.vendir_lock}}"
VENDIR_CONFIG_SHA = "{{ exec(command='sha256sum <vendir.yml | cut -d\" \" -f1') }}"
VENDIR_LOCK_SHA = "{{ exec(command='sha256sum <' ~ vars.vendir_lock ~ ' | cut -d\" \" -f1') }}"
FILE_COUNT = "{{ exec(command='wc -l <' ~ vars.artifact_dir ~ '/dotfiles.files.txt | tr -d \" \"') }}"
COMMIT = "{{ exec(command='git rev-parse HEAD') }}"
TREE = "{{ exec(command='git rev-parse HEAD^{tree}') }}"
SOURCE_DATE_EPOCH = "{{ exec(command='git show -s --format=%ct HEAD') }}"

[tasks."artifact:dotfiles:manifest"]
description = "Build the identity manifest for the dotfiles set"
depends = ["artifact:dotfiles:manifest:hashes", "artifact:dotfiles:files:text"]
run = """
jq -n -f misc/jq/manifest.jq \
  --rawfile hashes "${ARTIFACT_DIR}/dotfiles-hashes.txt" \
  >"${ARTIFACT_DIR}/dotfiles/manifest.json"
"""

[tasks."artifact:dotfiles:checksum"]
description = "Write SHA-256 checksums for the dotfiles set"
depends = ["artifact:dotfiles:manifest"]
dir = "{{vars.artifact_dir}}/dotfiles"
run = """
sha256sum dotfiles.tar.gz sbom.spdx.json vex.openvex.json licenses.json manifest.json \
  >checksums.sha256
"""

[tasks."artifact:dotfiles:verify:hash"]
description = "Check the dotfiles set against its own checksums"
dir = "{{vars.artifact_dir}}/dotfiles"
run = "sha256sum --check checksums.sha256"

[tasks."artifact:dotfiles:verify:commit"]
description = "Check that the dotfiles manifest describes the current commit"
dir = "{{vars.artifact_dir}}/dotfiles"
env = { COMMIT = "{{ exec(command='git rev-parse HEAD') }}" }
run = """
jq -e --arg expected "${GITHUB_SHA:-$COMMIT}" \
  '.source.commit == $expected' manifest.json
"""

[tasks."artifact:dotfiles:scan:vuln"]
description = "Scan the dotfiles SBOM against the Trivy database"
env = { DOCKER_CONFIG = "{{config_root}}/.tools/docker" }
run = """
trivy sbom {{vars.artifact_dir}}/dotfiles/sbom.spdx.json \
  --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --timeout 10m
"""

[tasks."artifact:dotfiles:scan:grype"]
description = "Scan the dotfiles SBOM against the Grype database"
run = "grype sbom:{{vars.artifact_dir}}/dotfiles/sbom.spdx.json -c .grype.yaml"

[tasks."artifact:dotfiles:scan:licenses"]
description = "Report the dotfiles SBOM licenses [Linux/macOS only]"
run = """
grant check {{vars.artifact_dir}}/dotfiles/sbom.spdx.json \
  --config .grant.yaml || true
"""
run_windows = ""

[tasks."artifact:dotfiles:scan:manifest"]
description = "Check the dotfiles manifest shape"
run = """
conftest test --policy misc/policy/manifest.rego --namespace manifest \
  {{vars.artifact_dir}}/dotfiles/manifest.json
"""

[tasks."artifact:dotfiles:build"]
description = "Pack the dotfiles archive and describe it: SBOM, VEX, licenses, manifest, checksums"
run = [
  { task = "artifact:dotfiles:pack" },
  { task = "artifact:dotfiles:sbom" },
  { task = "artifact:dotfiles:vex" },
  { task = "artifact:dotfiles:licenses" },
  { task = "artifact:dotfiles:licenses:report" },
  { task = "artifact:dotfiles:manifest" },
  { task = "artifact:dotfiles:checksum" },
]

[tasks."artifact:dotfiles:verify"]
description = "Verify the dotfiles set: checksums and build identity"
run = [
  { task = "artifact:dotfiles:verify:hash" },
  { task = "artifact:dotfiles:verify:commit" },
]

[tasks."artifact:dotfiles:scan"]
description = "Scan the dotfiles release: vulnerabilities, licenses, manifest shape"
run = [
  { task = "artifact:dotfiles:scan:vuln" },
  { task = "artifact:dotfiles:scan:grype" },
  { task = "artifact:dotfiles:scan:licenses" },
  { task = "artifact:dotfiles:scan:manifest" },
]

[tasks."artifact:dotfiles:all"]
description = "Build, describe, scan and verify the dotfiles release set"
run = [
  { task = "artifact:dotfiles:clean" },
  { task = "artifact:dotfiles:build" },
  { task = "artifact:dotfiles:scan" },
  { task = "artifact:dotfiles:verify" },
]

# ==============================================================================
# Stage 3: Wallpapers Artifact Gate
# ==============================================================================

[tasks."artifact:wallpapers:clean"]
description = "Remove the wallpapers release set"
run = "rm -rf {{vars.artifact_dir}}/wallpapers"

[tasks."artifact:wallpapers:components"]
description = "List the wallpaper collections with their origins"
depends = ["artifact:setup"]
run = """
yq -o=json --from-file misc/jq/components.yq vendir.wallpapers.yml > {{vars.artifact_dir}}/wallpapers-components.json
"""

[tasks."artifact:wallpapers:files"]
description = "Enumerate the wallpapers archive contents [run deploy:sync:wallpapers first]"
depends = ["artifact:wallpapers:components"]
env = { ARTIFACT_DIR = "{{vars.artifact_dir}}" }
run = """
jq -r '.[].path' "${ARTIFACT_DIR}/wallpapers-components.json" | tr -d '\\r' \
  | xargs -I{} find {} -type f -print0 \
  | sort -z -u >"${ARTIFACT_DIR}/wallpapers.files"
"""

[tasks."artifact:wallpapers:files:text"]
description = "Convert the wallpapers archive list to one path per line"
depends = ["artifact:wallpapers:files"]
env = { ARTIFACT_DIR = "{{vars.artifact_dir}}" }
run = "tr '\\0' '\\n' <\"${ARTIFACT_DIR}/wallpapers.files\" >\"${ARTIFACT_DIR}/wallpapers.files.txt\""

[tasks."artifact:wallpapers:pack".env]
ARTIFACT_DIR = "{{vars.artifact_dir}}"
SOURCE_DATE_EPOCH = "{{ exec(command='git show -s --format=%ct HEAD') }}"

[tasks."artifact:wallpapers:pack"]
description = "Pack the wallpaper collections reproducibly"
depends = ["artifact:wallpapers:files"]
run = """
tar --create --no-recursion --null --files-from="${ARTIFACT_DIR}/wallpapers.files" \
  --format=posix --owner=0 --group=0 --numeric-owner \
  --mtime="@${SOURCE_DATE_EPOCH}" \
  --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
  | gzip -n >"${ARTIFACT_DIR}/wallpapers/wallpapers.tar.gz"
"""

[tasks."artifact:wallpapers:licenses".env]
ARTIFACT_DIR = "{{vars.artifact_dir}}"
SCAN_ROOT = "dotfiles/.local/share/backgrounds"
LICENSES_ALLOWED = "{{vars.artifact_licenses_allowed}}"

[tasks."artifact:wallpapers:licenses"]
description = "Build the license inventory of the wallpapers set"
depends = ["security:trivy:license:backgrounds", "artifact:wallpapers:files:text"]
run = """
jq -n -f misc/jq/licenses.jq \
  --slurpfile scan "${ARTIFACT_DIR}/wallpapers-scan.json" \
  --slurpfile components "${ARTIFACT_DIR}/wallpapers-components.json" \
  --rawfile files "${ARTIFACT_DIR}/wallpapers.files.txt" \
  >"${ARTIFACT_DIR}/wallpapers/licenses.json"
"""

[tasks."artifact:wallpapers:licenses:report"]
description = "Print the license warnings of the wallpapers set"
run = """
jq -r -f misc/jq/license-warnings.jq \
  {{vars.artifact_dir}}/wallpapers/licenses.json
"""

[tasks."artifact:wallpapers:manifest:hashes"]
description = "Hash the wallpapers payload files for the manifest"
depends = ["artifact:wallpapers:pack", "artifact:wallpapers:licenses"]
dir = "{{vars.artifact_dir}}/wallpapers"
run = "sha256sum wallpapers.tar.gz licenses.json >../wallpapers-hashes.txt"

[tasks."artifact:wallpapers:manifest".env]
ARTIFACT_DIR = "{{vars.artifact_dir}}"
ARTIFACT_SET = "wallpapers"
VENDIR_CONFIG = "vendir.wallpapers.yml"
VENDIR_LOCK = "{{vars.vendir_wallpapers_lock}}"
VENDIR_CONFIG_SHA = "{{ exec(command='sha256sum <vendir.wallpapers.yml | cut -d\" \" -f1') }}"
VENDIR_LOCK_SHA = "{{ exec(command='sha256sum <' ~ vars.vendir_wallpapers_lock ~ ' | cut -d\" \" -f1') }}"
FILE_COUNT = "{{ exec(command='wc -l <' ~ vars.artifact_dir ~ '/wallpapers.files.txt | tr -d \" \"') }}"
COMMIT = "{{ exec(command='git rev-parse HEAD') }}"
TREE = "{{ exec(command='git rev-parse HEAD^{tree}') }}"
SOURCE_DATE_EPOCH = "{{ exec(command='git show -s --format=%ct HEAD') }}"

[tasks."artifact:wallpapers:manifest"]
description = "Build the identity manifest for the wallpapers set"
depends = ["artifact:wallpapers:manifest:hashes", "artifact:wallpapers:files:text"]
run = """
jq -n -f misc/jq/manifest.jq \
  --rawfile hashes "${ARTIFACT_DIR}/wallpapers-hashes.txt" \
  >"${ARTIFACT_DIR}/wallpapers/manifest.json"
"""

[tasks."artifact:wallpapers:checksum"]
description = "Write SHA-256 checksums for the wallpapers set"
depends = ["artifact:wallpapers:manifest"]
dir = "{{vars.artifact_dir}}/wallpapers"
run = "sha256sum wallpapers.tar.gz licenses.json manifest.json >checksums.sha256"

[tasks."artifact:wallpapers:verify:hash"]
description = "Check the wallpapers set against its own checksums"
dir = "{{vars.artifact_dir}}/wallpapers"
run = "sha256sum --check checksums.sha256"

[tasks."artifact:wallpapers:verify:commit"]
description = "Check that the wallpapers manifest describes the current commit"
dir = "{{vars.artifact_dir}}/wallpapers"
env = { COMMIT = "{{ exec(command='git rev-parse HEAD') }}" }
run = """
jq -e --arg expected "${GITHUB_SHA:-$COMMIT}" \
  '.source.commit == $expected' manifest.json
"""

[tasks."artifact:wallpapers:scan:manifest"]
description = "Check the wallpapers manifest shape"
run = """
conftest test --policy misc/policy/manifest.rego --namespace manifest \
  {{vars.artifact_dir}}/wallpapers/manifest.json
"""

[tasks."artifact:wallpapers:build"]
description = "Pack the wallpapers archive and describe it: licenses, manifest, checksums"
run = [
  { task = "artifact:wallpapers:pack" },
  { task = "artifact:wallpapers:licenses" },
  { task = "artifact:wallpapers:licenses:report" },
  { task = "artifact:wallpapers:manifest" },
  { task = "artifact:wallpapers:checksum" },
]

[tasks."artifact:wallpapers:verify"]
description = "Verify the wallpapers set: checksums and build identity"
run = [
  { task = "artifact:wallpapers:verify:hash" },
  { task = "artifact:wallpapers:verify:commit" },
]

[tasks."artifact:wallpapers:all"]
description = "Build, describe and verify the wallpapers release set [~1.1 GB]"
run = [
  { task = "artifact:wallpapers:clean" },
  { task = "artifact:wallpapers:build" },
  { task = "artifact:wallpapers:scan:manifest" },
  { task = "artifact:wallpapers:verify" },
]

# ==============================================================================
# Stage 3: Deploy documentation
# ==============================================================================

[tasks."deploy:cloudflare:preview"]
description = "Deploy the built docs to a Cloudflare Pages preview [needs CF_PAGES_PROJECT, PR_NUMBER]"
env = { CF_PAGES_DIST = "{{vars.docs_dist}}" }
run = """
wrangler pages deploy "${CF_PAGES_DIST}" \
  --project-name="${CF_PAGES_PROJECT}" \
  --branch="pr-${PR_NUMBER}" \
  --commit-dirty=false
"""

[tasks."deploy:cloudflare:production"]
description = "Deploy the built docs to Cloudflare Pages production [needs CF_PAGES_PROJECT]"
env = { CF_PAGES_DIST = "{{vars.docs_dist}}" }
run = """
wrangler pages deploy "${CF_PAGES_DIST}" \
  --project-name="${CF_PAGES_PROJECT}" \
  --commit-dirty=false
"""
