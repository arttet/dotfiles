[tasks."validate:multiplexer:tmux"]
description = "Validate Tmux configuration"
shell = "nu -c"
run = """
if (which tmux | is-not-empty) {
    let config = [$env.PWD, "dotfiles", ".config", "tmux", "tmux.conf"] | path join
    let socket = $"tmux-test-verify-($nu.pid)"
    let session = "test"

    ^tmux -V

    ^tmux -f $config -L $socket start-server
    print $"start-server exit code: ($env.LAST_EXIT_CODE)"

    ^tmux -L $socket new-session -d -s $session
    print $"new-session exit code: ($env.LAST_EXIT_CODE)"

    ^tmux -L $socket show-messages

    def check [socket: string, scope: string, opt: string, expected: string] {
        let actual = (^tmux -L $socket show-options $scope $opt)
        if ($actual | str contains $expected) {
            print $"OK: ($opt) = ($actual)"
            true
        } else {
            print $"FAIL: ($opt) — expected to contain '($expected)', got '($actual)'"
            false
        }
    }

    let results = [
        (check $socket "-g" "default-terminal" "tmux-256color")
        (check $socket "-s" "set-clipboard" "on")
        (check $socket "-g" "prefix" "C-a")
    ]

    do -i { ^tmux -L $socket kill-session -t $session }
    do -i { ^tmux -L $socket kill-server }

    if ($results | any {|r| not $r }) {
        exit 1
    }
}
"""

