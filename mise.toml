    --command-name zsh.raw '{{vars.bench_zsh_raw}}'
    --command-name zsh.configured '{{vars.bench_zsh_configured}}'
)
"""

[tasks."bench:nu"]
description = "Benchmark Nushell startup (raw vs configured)"
depends = ["bench:setup"]
shell = "nu -c"
env = { XDG_CONFIG_HOME = "{{config_root}}/dotfiles/.config" }
run = """
(
  ^{{vars.hyperfine}}
    --export-json {{vars.bench_runs}}/nu.json
    --export-markdown {{vars.bench_runs}}/nu.md
    --command-name nu.raw '{{vars.bench_nu_raw}}'
    --command-name nu.configured '{{vars.bench_nu_configured}}'
