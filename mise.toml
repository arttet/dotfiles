[tool_alias]
dotter = "aqua:SuperCuber/dotter"
grant = "github:anchore/grant"
nushell = "aqua:nushell/nushell"
selene = "aqua:Kampfkarren/selene"
vexctl = "aqua:openvex/vexctl"

[tools]
act = "0.2.89"
actionlint = "1.7.12"
aube = "2.2.0"
codeql = { version = "2.26.4", bin_path = "codeql", platforms = { linux-x64 = { asset_pattern = "codeql-linux64.zip" }, macos-arm64 = { asset_pattern = "codeql-osx64.zip" }, macos-x64 = { asset_pattern = "codeql-osx64.zip" }, windows-x64 = { asset_pattern = "codeql-win64.zip" } } }
conftest = "0.69.0"
dotter = "0.13.5"
dprint = "0.56.1"
editorconfig-checker = "3.11.2"
grant = { version = "0.6.8", os = ["linux", "macos"] }
grype = "0.118.0"
hk = "1.56.1"
hyperfine = "1.20.0"
jq = "1.8.2"
just = "1.58.0"
lychee = "0.24.2"
node = "26.8.1"
nushell = "0.115.1"
osv-scanner = "2.5.1"
powershell = "7.6.5"
selene = "0.31.0"
semgrep = "1.175.0"
shellcheck = "0.11.0"
shfmt = "3.13.1"
stylua = "2.5.2"
syft = "1.51.1"
taplo = "0.10.0"
tmux = { version = "3.7b", os = ["linux", "macos"] }
trivy = "0.74.0"
trufflehog = "3.97.1"
typos = "1.49.1"
vendir = "0.46.1"
vexctl = "0.4.4"
yamllint = "1.38.0"
yq = "4.53.6"
zizmor = "1.29.0"

"npm:@modelcontextprotocol/inspector" = "2.4.0"
"npm:markdownlint-cli2" = "0.23.2"
"npm:retire" = "5.7.0"
"npm:stylelint" = "17.14.1"
"npm:wrangler" = "4.127.1"

[env]
AUBE_FETCH_RETRIES = "10"
AUBE_FETCH_RETRY_FACTOR = "2"
AUBE_FETCH_RETRY_MAXTIMEOUT = "180000"
AUBE_FETCH_RETRY_MINTIMEOUT = "20000"
AUBE_TRUST_POLICY_EXCLUDE = "pino@9.14.0,fastq@1.20.2"
DPRINT_CACHE_DIR = "{{config_root}}/.tools/dprint"

[vars]
# NOTE: Development Gate
# NOTE: https://github.com/renovatebot/renovate/pkgs/container/renovate
renovate_image = "ghcr.io/renovatebot/renovate:44.39.2@sha256:e6b93e709ca64495ab9307350b260064276ee02d15c6886387fd2d42c926623b"

# NOTE: vendir on Windows normalizes lock paths to backslashes, hence a lock file per platform.
vendir_lock = "{% if os() == 'windows' %}vendir.lock.windows.yml{% else %}vendir.lock.yml{% endif %}"
vendir_wallpapers_lock = "{% if os() == 'windows' %}vendir.lock.wallpapers.windows.yml{% else %}vendir.lock.wallpapers.yml{% endif %}"

# NOTE: Format Quality Gate
bash_targets = "dotfiles/.bashrc dotfiles/.bash_profile dotfiles/.config/bash dotfiles/.config/shell"

# NOTE: Security Gate
codeql_dir = ".tools/codeql"
codeql_config = ".github/codeql/codeql-config.yml"
codeql_config_javascript = ".github/codeql/javascript.yml"
semgrep_web = "misc/semgrep/web.yaml"
vex_file = "misc/vex/dotfiles.openvex.json"

# NOTE: Antivirus Gate
# NOTE: https://hub.docker.com/r/clamav/clamav/tags
clamav_db_dir = ".tools/clamav-db"
clamav_image = "clamav/clamav:1.5.4_base@sha256:aa2899ac82c7f9547954c8c84764c313f43029e31a36faa1ee527a2171789653"

# NOTE: Documentation Gate
docs_dist = "docs/dist"
docs_archive = "docs/dotfiles-docs-*"

# NOTE: Performance Gate
bench_dir = ".tools/bench"
bench_runs = ".tools/bench/runs"
hyperfine = "hyperfine --warmup 2 --runs 10 --shell=none"
bench_bash_raw = "bash --noprofile --norc -c exit"
bench_bash_configured = 'bash --noprofile --norc -i -c "source dotfiles/.config/bash/bash_profile; source dotfiles/.config/bash/bashrc; exit"'
bench_zsh_raw = "zsh -f -c exit"
bench_zsh_configured = "zsh --login --interactive -c exit"
bench_nu_raw = "nu --no-config-file --no-std-lib -c exit"
bench_nu_configured = "nu --login --interactive -c exit"
bench_pwsh_raw = "pwsh -NoLogo -NoProfile -Command exit"
bench_pwsh_configured = 'pwsh -NoLogo -NoProfile -Command ". ./dotfiles/.config/powershell/profile.ps1; exit"'
bench_tmux_raw = "tmux -L dotfiles-bench-raw -f /dev/null new-session -d -s benchmark"
bench_tmux_configured = "tmux -L dotfiles-bench-configured -f dotfiles/.config/tmux/tmux.conf new-session -d -s benchmark"
bench_tmux_cleanup = 'sh -c "tmux -L dotfiles-bench-raw kill-server 2>/dev/null || true; tmux -L dotfiles-bench-configured kill-server 2>/dev/null || true"'
bench_report = "jq -n --slurpfile benchmark .tools/bench/results.json --slurpfile baseline misc/baseline.json --rawfile tables .tools/bench/tables.md -f misc/jq/bench.jq"

# NOTE: Artifact Gate
artifact_dir = ".tools/artifacts"
artifact_licenses_allowed = "MIT,Apache-2.0"
# NOTE: An allowlist, deliberately not `.gitattributes export-ignore`: a blocklist would ship every new
# NOTE: top-level file by default. `.dotter/` and INSTALL.md are what make an unpacked release deployable.
artifact_tracked = "dotfiles .dotter/global.toml .dotter/local.toml INSTALL.md"

[settings]
auto_install = false
lockfile = true

# ==============================================================================
# Development Gate
# ==============================================================================

[tasks."deps:renovate:setup"]
description = "Create the Renovate cache directory"
run = "mkdir -p .tools/renovate/cache"

[tasks."deps:renovate"]
description = "Show available dependency updates with Renovate local report"
depends = ["deps:renovate:setup"]
env = { LOG_LEVEL = "info", RENOVATE_GITHUB_COM_TOKEN = "{{ exec(command='gh auth token') }}", MSYS_NO_PATHCONV = "1" }
run = """
podman run --rm \
  -e LOG_LEVEL \
  -e RENOVATE_GITHUB_COM_TOKEN \
  -v "$PWD:/usr/src/app:Z" \
  -v "$PWD/.tools/renovate:/tmp/renovate:Z" \
  "{{vars.renovate_image}}" \
  --platform=local \
  --onboarding=false \
  --require-config=required \
  --report-type=file \
  --report-path=/tmp/renovate/renovate-report.json \
  --cache-dir=/tmp/renovate/cache
"""

[tasks."deps:vendir:update:config"]
description = "Re-resolve refs and rewrite the vendored plugins lock file"
run = "vendir sync --lock-file {{vars.vendir_lock}}"

[tasks."deps:vendir:update:wallpapers"]
description = "Re-resolve refs and rewrite the wallpapers lock file"
run = """
vendir sync --file vendir.wallpapers.yml \
  --lock-file {{vars.vendir_wallpapers_lock}}
"""

[tasks."deps:vendir:update"]
description = "Re-resolve refs and rewrite both vendir lock files"
run = [
  { task = "deps:vendir:update:config" },
  { task = "deps:vendir:update:wallpapers" },
]

[tasks."deps:vendir:outdated:config"]
description = "Show vendored plugins whose pinned commit is behind upstream"
shell = "nu -c"
run = "nu misc/nu/vendir-status.nu vendir.yml {{vars.vendir_lock}}"

[tasks."deps:vendir:outdated:wallpapers"]
description = "Show wallpaper collections whose pinned commit is behind upstream"
shell = "nu -c"
run = "nu misc/nu/vendir-status.nu vendir.wallpapers.yml {{vars.vendir_wallpapers_lock}}"

[tasks."deps:vendir:outdated"]
description = "Show every vendir dependency whose pinned commit is behind upstream"
run = [
  { task = "deps:vendir:outdated:config" },
  { task = "deps:vendir:outdated:wallpapers" },
]

[tasks."deps:vendir:summary"]
description = "Write the vendir dependency status as Markdown [nightly job summary]"
shell = "nu -c"
run = [
  "nu misc/nu/vendir-status.nu vendir.yml {{vars.vendir_lock}} --format markdown",
  "nu misc/nu/vendir-status.nu vendir.wallpapers.yml {{vars.vendir_wallpapers_lock}} --format markdown",
]

[tasks."hooks:install"]
description = "Install hk git hooks into this clone"
run = "hk install"

[tasks."hooks:run"]
description = "Run the pre-commit hook without committing"
run = "hk run pre-commit"

[tasks.check]
description = "Run checks"
depends = [
  "fmt:all",
  "lint:all",
  "security:all",
  "docs:all",
  "validate:all",
]

[tasks."check:all"]
description = "Run all checks"
depends = [
  "fmt:all",
  "lint:all",
  "security:all",
  "antivirus:all",
  "docs:all",
  "validate:all",
  "bench:ci",
  "artifact:dotfiles:all",
]

[tasks.ci]
description = "Run GitHub Actions locally with act"
run = """
act pull_request --bind --artifact-server-path .tools/act-artifacts \
  -s GITHUB_TOKEN="$(gh auth token)" \
  -P ubuntu-26.04=catthehacker/ubuntu:act-latest
"""

[tasks."ci:list"]
description = "List GitHub Actions jobs available via act"
run = "act --list"

# ==============================================================================
# Deployment Gate
# ==============================================================================

[tasks."deploy:sync:config"]
description = "Synchronize vendored plugins"
run = "vendir sync --locked --lock-file {{vars.vendir_lock}}"

[tasks."deploy:sync:wallpapers"]
description = "Synchronize the wallpaper collections"
run = "vendir sync --locked --file vendir.wallpapers.yml --lock-file {{vars.vendir_wallpapers_lock}}"

[tasks."deploy:sync"]
description = "Synchronize vendored plugins and wallpapers"
run = [
  { task = "deploy:sync:config" },
  { task = "deploy:sync:wallpapers" },
]

[tasks."deploy:check"]
description = "Preview the dotfiles deployment"
run = "dotter deploy --verbose --dry-run"

[tasks."deploy:apply"]
description = "Deploy dotfiles with dotter"
run = "dotter deploy --verbose --force"

[tasks."deploy:undeploy"]
description = "Undeploy dotfiles with dotter"
run = "dotter undeploy --verbose --noconfirm --force"

# ==============================================================================
# Format Quality Gate
# ==============================================================================

[tasks."fmt:write"]
description = "Format source files"
run = [
  "dprint fmt",
  "stylua --allow-hidden .",
  "shfmt --write {{vars.bash_targets}}",
  "just --fmt",
]

[tasks."fmt:dprint"]
description = "dprint format check"
run = "dprint check"

[tasks."fmt:editorconfig"]
description = "EditorConfig check"
run = "ec"

[tasks."fmt:just"]
description = "Justfile format check"
run = "just --fmt --check"

[tasks."fmt:shfmt"]
description = "Shell format check"
run = "shfmt --diff {{vars.bash_targets}}"

[tasks."fmt:stylua"]
description = "Lua format check"
run = "stylua --allow-hidden --check ."

[tasks."fmt:all"]
description = "All format checks"
depends = [
  "fmt:dprint",
  "fmt:editorconfig",
  "fmt:just",
  "fmt:shfmt",
  "fmt:stylua",
]

# ==============================================================================
# Lint Quality Gate
# ==============================================================================

[tasks."lint:actions"]
description = "GitHub Actions lint"
run = "actionlint"

[tasks."lint:bash"]
description = "Shell lint"
shell = "bash -c"
run = """
shellcheck --shell=bash --external-sources $(shfmt --find {{vars.bash_targets}})
"""

[tasks."lint:css"]
description = "CSS lint"
run = "stylelint --config .stylelintrc.json './dotfiles/.config/**/*.css'"

[tasks."lint:lua:nvim"]
description = "Neovim Lua lint"
run = "selene dotfiles/.config/nvim"

[tasks."lint:lua:hyprland"]
description = "Hyprland Lua lint"
run = "selene --config dotfiles/.config/hypr/selene.toml dotfiles/.config/hypr/hyprland.lua"

[tasks."lint:lua:wezterm"]
description = "WezTerm Lua lint"
run = "selene dotfiles/.config/wezterm"

[tasks."lint:markdown"]
description = "Markdown lint"
run = "markdownlint-cli2"

[tasks."lint:toml"]
description = "TOML lint"
run = "taplo lint --no-schema"

[tasks."lint:typos"]
description = "Spell check"
run = "typos"

[tasks."lint:yaml"]
description = "YAML lint"
run = "yamllint ."

[tasks."lint:all"]
description = "All lint checks"
depends = [
  "lint:actions",
  "lint:bash",
  "lint:css",
  "lint:lua:hyprland",
  "lint:lua:nvim",
  "lint:lua:wezterm",
  "lint:markdown",
  "lint:toml",
  "lint:typos",
  "lint:yaml",
]

# ==============================================================================
# Security Gate
# ==============================================================================

[tasks."security:codeql:setup"]
description = "Create the CodeQL working directory"
run = "mkdir -p {{vars.codeql_dir}}"

[tasks."security:codeql:db:actions"]
description = "Build or refresh the CodeQL database for the GitHub Actions workflows"
depends = ["security:codeql:setup"]
run = """
codeql database create {{vars.codeql_dir}}/db-actions \
  --language=actions \
  --source-root=. \
  --build-mode=none \
  --codescanning-config={{vars.codeql_config}} \
  --overwrite
"""

[tasks."security:codeql:analyze:actions"]
description = "Analyze the GitHub Actions CodeQL database into SARIF"
depends = ["security:codeql:db:actions"]
run = """
codeql database analyze {{vars.codeql_dir}}/db-actions codeql/actions-queries \
  --download \
  --format=sarif-latest \
  --sarif-category=actions \
  --output={{vars.codeql_dir}}/actions.sarif
"""

[tasks."security:codeql:csv:actions"]
description = "Export the GitHub Actions CodeQL results as CSV"
depends = ["security:codeql:analyze:actions"]
run = """
codeql database interpret-results {{vars.codeql_dir}}/db-actions \
  --format=csv \
  --output={{vars.codeql_dir}}/actions.csv
"""

[tasks."security:codeql:report:actions"]
description = "Render the GitHub Actions CodeQL findings as a table"
depends = ["security:codeql:csv:actions"]
run = "nu misc/nu/codeql-report.nu {{vars.codeql_dir}}/actions.csv actions"

[tasks."security:codeql:actions"]
description = "CodeQL analysis of the GitHub Actions workflows"
run = [
  { task = "security:codeql:analyze:actions" },
  { task = "security:codeql:csv:actions" },
  { task = "security:codeql:report:actions" },
]

[tasks."security:conftest"]
description = "Repository policy checks (OPA/Rego)"
run = [
  "conftest test --policy misc/policy/workflows.rego --namespace workflows .github/workflows",
  "conftest test --policy misc/policy/mise.rego --namespace mise mise.toml",
  "conftest test --policy misc/policy/vex.rego --namespace vex {{vars.vex_file}}",
]

[tasks."security:grant"]
description = "License inventory of the deployed tree"
run = "grant check dir:dotfiles --config .grant.yaml"
run_windows = ""

[tasks."security:grype"]
description = "Grype vulnerability scan of the source tree"
run = "grype dir:. --name dotfiles -c .grype.yaml --verbose"

[tasks."security:grype:images"]
description = "Grype scan of the container images pinned for CI"
run = [
  "grype {{vars.clamav_image}} -c .grype.yaml",
  "grype {{vars.renovate_image}} -c .grype.yaml",
]

[tasks."security:osv"]
description = "OSV vulnerability scan of the source tree"
run = "osv-scanner scan source --recursive --allow-no-lockfiles --all-packages --all-vulns"

[tasks."security:semgrep"]
description = "SAST scan (OSS rules)"
run = "semgrep scan --config p/ci --oss-only --metrics=off --error --verbose"

[tasks."security:semgrep:web"]
description = "XSS and client-side injection rules over committed HTML, SVG, Vue and Markdown"
run = "semgrep scan --config {{vars.semgrep_web}} --metrics=off --error dotfiles docs/src"

[tasks."security:trivy:setup"]
description = "Prepare the Trivy cache and report directories"
run = "mkdir -p .tools/docker .tools/trivy"

[tasks."security:trivy:scan"]
description = "Scan the committed tree for vulnerabilities, secrets and misconfiguration"
depends = ["security:trivy:setup"]
env = { DOCKER_CONFIG = "{{config_root}}/.tools/docker" }
run = """
trivy fs \
  --scanners vuln,secret,misconfig \
  --include-dev-deps \
  --skip-dirs .tools \
  --format json \
  --output .tools/trivy/trivy.json \
  --exit-code 0 \
  --timeout 5m \
  .
"""

[tasks."security:trivy:table"]
description = "Render the Trivy scan report as a table"
depends = ["security:trivy:scan"]
run = """
trivy convert \
  --scanners vuln,secret,misconfig \
  --format table \
  .tools/trivy/trivy.json
"""

[tasks."security:trivy:sarif"]
description = "Render the Trivy scan report as SARIF for code scanning"
depends = ["security:trivy:scan"]
run = """
trivy convert \
  --scanners vuln,secret,misconfig \
  --format sarif \
  --output .tools/trivy/trivy-results.sarif \
  .tools/trivy/trivy.json
"""

[tasks."security:trivy:license"]
description = "Scan license is not allowed"
depends = ["security:trivy:setup"]
env = { DOCKER_CONFIG = "{{config_root}}/.tools/docker" }
run = """
trivy fs \
  --config misc/trivy/license.yaml \
  --scanners license \
  --skip-dirs .tools \
  --format table \
  --exit-code 0 \
  --timeout 5m \
  .
"""

[tasks."security:trivy:license:scan"]
description = "Report every license found in the deployed tree as JSON"
depends = ["artifact:setup"]
env = { DOCKER_CONFIG = "{{config_root}}/.tools/docker" }
run = """
trivy fs \
  --scanners license \
  --license-full \
  --format json \
  --output {{vars.artifact_dir}}/licenses-scan.json \
  --exit-code 0 \
  --timeout 10m \
  dotfiles
"""

[tasks."security:trivy:license:backgrounds"]
description = "Report every license found in the wallpaper collections as JSON"
depends = ["artifact:setup"]
env = { DOCKER_CONFIG = "{{config_root}}/.tools/docker" }
run = """
trivy fs \
  --scanners license \
  --license-full \
  --format json \
  --output {{vars.artifact_dir}}/wallpapers-scan.json \
  --exit-code 0 \
  --timeout 10m \
  dotfiles/.local/share/backgrounds
"""

[tasks."security:trufflehog"]
description = "Secret scanning over git history"
run = "trufflehog git file://. --results=verified,unknown --fail"

[tasks."security:zizmor"]
description = "GitHub Actions security audit"
env = { ZIZMOR_GITHUB_TOKEN = "{{ exec(command='gh auth token') }}" }
run = "zizmor --persona pedantic .github/"

[tasks."security:all"]
description = "All security checks"
depends = [
  "security:codeql:actions",
  "security:conftest",
  "security:grant",
  "security:grype",
  "security:osv",
  "security:semgrep",
  "security:semgrep:web",
  "security:trivy:license",
  "security:trivy:sarif",
  "security:trivy:table",
  "security:trufflehog",
  "security:zizmor",
]

# ==============================================================================
# Antivirus Gate
# ==============================================================================

[tasks."antivirus:setup"]
description = "Setup ClamAV"
run = "mkdir -p {{vars.clamav_db_dir}}"

[tasks."antivirus:update"]
description = "Update ClamAV database into CLAMAV_DB_DIR"
depends = ["antivirus:setup"]
env = { MSYS_NO_PATHCONV = "1" }
run = """
podman run --rm -v "{{vars.clamav_db_dir}}:/var/lib/clamav" "{{vars.clamav_image}}" \
  sh -c "sed -i '/^NotifyClamd/d' /etc/clamav/freshclam.conf; exec freshclam --foreground"
"""

[tasks."antivirus:scan"]
description = "Malware scan of the working tree"
env = { MSYS_NO_PATHCONV = "1" }
run = """
podman run \
  --rm \
  --entrypoint clamscan \
  --volume "$PWD:/scandir:ro" \
  --volume "{{vars.clamav_db_dir}}:/var/lib/clamav:ro" \
  "{{vars.clamav_image}}" \
    --recursive --infected ${CLAMAV_EXCLUDE_DIR:+--exclude-dir="$CLAMAV_EXCLUDE_DIR"} /scandir
"""

[tasks."antivirus:all"]
description = "All antivirus checks"
run = [
  { task = "antivirus:update" },
  { task = "antivirus:scan" },
]

# ==============================================================================
# Documentation Gate
# ==============================================================================

[tasks."docs:install"]
description = "Install documentation dependencies"
dir = "docs"
run = "aube install --frozen-lockfile"

[tasks."docs:audit"]
description = "Audit documentation dependencies"
dir = "docs"
run = "aube audit"

[tasks."docs:build"]
description = "Build VitePress documentation [set CI_BASE_URL to override the base]"
dir = "docs"
run = "aube run docs:build"

[tasks."docs:links:setup"]
description = "Create the Lychee working directory"
run = "mkdir -p .tools/lychee"

[tasks."docs:links"]
description = "Link check over built documentation"
depends = ["docs:links:setup"]
dir = ".tools/lychee"
run = """
lychee \
  --config "{{config_root}}/.lychee.toml" \
  --root-dir "{{config_root}}/docs/dist" \
  --no-progress \
  "{{config_root}}/docs/dist"
"""

[tasks."docs:codeql:db"]
description = "Build or refresh the CodeQL database for the documentation TypeScript sources"
depends = ["security:codeql:setup"]
run = """
codeql database create {{vars.codeql_dir}}/db-javascript \
  --language=javascript-typescript \
  --source-root=. \
  --build-mode=none \
  --codescanning-config={{vars.codeql_config_javascript}} \
  --overwrite
"""

[tasks."docs:codeql:analyze"]
description = "Analyze the documentation CodeQL database into SARIF"
depends = ["docs:codeql:db"]
run = """
codeql database analyze {{vars.codeql_dir}}/db-javascript codeql/javascript-queries \
  --download \
  --format=sarif-latest \
  --sarif-category=javascript \
  --output={{vars.codeql_dir}}/javascript.sarif
"""

[tasks."docs:codeql:csv"]
description = "Export the documentation CodeQL results as CSV"
depends = ["docs:codeql:analyze"]
run = """
codeql database interpret-results {{vars.codeql_dir}}/db-javascript \
  --format=csv \
  --output={{vars.codeql_dir}}/javascript.csv
"""

[tasks."docs:codeql:report"]
description = "Render the documentation CodeQL findings as a table"
depends = ["docs:codeql:csv"]
run = "nu misc/nu/codeql-report.nu {{vars.codeql_dir}}/javascript.csv javascript"

[tasks."docs:codeql"]
description = "CodeQL analysis of the documentation TypeScript sources"
run = [
  { task = "docs:codeql:analyze" },
  { task = "docs:codeql:csv" },
  { task = "docs:codeql:report" },
]

[tasks."docs:security"]
description = "Harden checks over the built documentation"
env = { DOCS_DIST = "{{vars.docs_dist}}" }
run = [
  "semgrep scan --config {{vars.semgrep_web}} --metrics=off --error --project-root {{vars.docs_dist}} {{vars.docs_dist}}",
  "retire --path {{vars.docs_dist}} --severity high --outputformat text",
]

[tasks."docs:pack"]
description = "Pack documentation package archive"
dir = "docs"
run = "aube pack"

[tasks."docs:unpack:setup"]
description = "Reset the documentation output directory"
env = { DOCS_DIST = "{{vars.docs_dist}}" }
run = """
rm -rf "${DOCS_DIST}"
mkdir -p "${DOCS_DIST}"
"""

[tasks."docs:unpack"]
description = "Unpack the packed documentation archive into the output directory"
depends = ["docs:unpack:setup"]
env = { DOCS_DIST = "{{vars.docs_dist}}", DOCS_ARCHIVE = "{{vars.docs_archive}}" }
run = """
tar -xzvf ${DOCS_ARCHIVE} -C "${DOCS_DIST}"
"""

[tasks."docs:all"]
description = "All documentation checks"
run = [
  { task = "docs:install" },
  { task = "docs:audit" },
  { task = "docs:build" },
  { task = "docs:links" },
  { task = "docs:codeql" },
