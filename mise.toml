[tool_alias]
selene = "aqua:Kampfkarren/selene"
dotter = "aqua:SuperCuber/dotter"
nushell = "aqua:nushell/nushell"

[tools]
act = "0.2.89"
actionlint = "1.7.12"
aube = "1.38.0"
dotter = "0.13.5"
dprint = "0.55.2"
editorconfig-checker = "3.11.1"
hk = "1.54.1"
hyperfine = "1.20.0"
jq = "1.8.2"
just = "1.58.0"
lychee = "0.24.2"
node = "26.7.0"
nushell = "0.114.1"
powershell = "7.6.4"
selene = "0.31.0"
semgrep = "1.172.0"
shellcheck = "0.11.0"
shfmt = "3.13.1"
stylua = "2.5.2"
taplo = "0.10.0"
tmux = { version = "3.7b", os = ["linux", "macos"] }
trivy = "0.73.0"
trufflehog = "3.96.0"
typos = "1.49.0"
vendir = "0.46.0"
yamllint = "1.38.0"
yq = "4.53.3"
zizmor = "1.29.0"

"npm:@modelcontextprotocol/inspector" = "2.1.0"
"npm:markdownlint-cli2" = { version = "0.23.2", allow_low_downloads = true }
"npm:stylelint" = "17.14.1"
"npm:wrangler" = "4.120.0"

[env]
AUBE_FETCH_RETRIES = "10"
AUBE_FETCH_RETRY_FACTOR = "2"
AUBE_FETCH_RETRY_MAXTIMEOUT = "180000"
AUBE_FETCH_RETRY_MINTIMEOUT = "20000"
AUBE_TRUST_POLICY_EXCLUDE = "@yarnpkg/libzip@3.2.2,pino@9.14.0"
DPRINT_CACHE_DIR = "{{config_root}}/.tools/dprint"

[vars]
bash_targets = "dotfiles/.bashrc dotfiles/.bash_profile dotfiles/.config/bash dotfiles/.config/shell"
clamav_db_dir = ".tools/clamav-db"
# NOTE: https://hub.docker.com/r/clamav/clamav/tags
clamav_image = "clamav/clamav:1.5.4_base@sha256:aa2899ac82c7f9547954c8c84764c313f43029e31a36faa1ee527a2171789653"
docs_dist = "docs/dist"
docs_archive = "docs/dotfiles-docs-*"
# NOTE: https://github.com/renovatebot/renovate/pkgs/container/renovate
renovate_image = "ghcr.io/renovatebot/renovate:44.16.1@sha256:d7b833d9aae601312d9afca391212620fce22eef2faa60e8cf00a9734220a1c5"

# NOTE: Performance gate
bench_dir = ".tools/bench"
bench_runs = ".tools/bench/runs"
hyperfine = "hyperfine --warmup 2 --runs 10 --shell=none"
bench_bash_raw = "bash --noprofile --norc -c exit"
bench_bash_configured = 'bash --noprofile --norc -i -c "source dotfiles/.config/bash/bash_profile; source dotfiles/.config/bash/bashrc; exit"'
bench_zsh_raw = "zsh -f -c exit"
bench_zsh_configured = "zsh --login --interactive -c exit"
bench_nu_raw = "nu --no-config-file --no-std-lib -c exit"
bench_nu_configured = "nu --login --interactive -c exit"
bench_pwsh_raw = "pwsh -NoLogo -NoProfile -Command exit"
bench_pwsh_configured = 'pwsh -NoLogo -NoProfile -Command ". ./dotfiles/.config/powershell/profile.ps1; exit"'
bench_tmux_raw = "tmux -L dotfiles-bench-raw -f /dev/null new-session -d -s benchmark"
bench_tmux_configured = "tmux -L dotfiles-bench-configured -f dotfiles/.config/tmux/tmux.conf new-session -d -s benchmark"
bench_tmux_cleanup = 'sh -c "tmux -L dotfiles-bench-raw kill-server 2>/dev/null || true; tmux -L dotfiles-bench-configured kill-server 2>/dev/null || true"'
bench_report = "jq -n --slurpfile benchmark .tools/bench/results.json --slurpfile baseline misc/baseline.json --rawfile tables .tools/bench/tables.md -f misc/bench.jq"

[settings]
auto_install = false
lockfile = true

# ==============================================================================
# Development Gate
# ==============================================================================

[tasks."deps:renovate:setup"]
description = "Create the Renovate cache directory"
run = "mkdir -p .tools/renovate/cache"

[tasks."deps:renovate"]
description = "Show available dependency updates with Renovate local report"
depends = ["deps:renovate:setup"]
env = { LOG_LEVEL = "info", RENOVATE_GITHUB_COM_TOKEN = "{{ exec(command='gh auth token') }}", MSYS_NO_PATHCONV = "1" }
run = """
podman run --rm \
  -e LOG_LEVEL \
  -e RENOVATE_GITHUB_COM_TOKEN \
  -v "$PWD:/usr/src/app:Z" \
  -v "$PWD/.tools/renovate:/tmp/renovate:Z" \
  "{{vars.renovate_image}}" \
  --platform=local \
  --onboarding=false \
  --require-config=required \
  --report-type=file \
  --report-path=/tmp/renovate/renovate-report.json \
  --cache-dir=/tmp/renovate/cache
"""

[tasks."hooks:install"]
description = "Install hk git hooks into this clone"
run = "hk install"

[tasks."hooks:run"]
description = "Run the pre-commit hook without committing"
run = "hk run pre-commit"

[tasks.check]
description = "Run checks"
depends = ["fmt:all", "lint:all", "security:all", "docs:all", "validate:all"]

[tasks."check:all"]
description = "Run all checks"
depends = ["fmt:all", "lint:all", "security:all", "antivirus:all", "docs:all", "validate:all", "bench:ci"]

[tasks.ci]
description = "Run GitHub Actions locally with act"
run = """
act pull_request --bind --artifact-server-path .tools/act-artifacts \
  -s GITHUB_TOKEN="$(gh auth token)" \
  -P ubuntu-26.04=catthehacker/ubuntu:act-latest
"""

[tasks."ci:list"]
description = "List GitHub Actions jobs available via act"
run = "act --list"

# ==============================================================================
# Deployment Gate
# ==============================================================================

[tasks."deploy:sync"]
description = "Synchronize vendored plugins and themes"
run = "vendir sync --locked --lock-file {% if os() == 'windows' %}vendir.lock.windows.yml{% else %}vendir.lock.yml{% endif %}"

[tasks."deploy:check"]
description = "Preview the dotfiles deployment"
run = "dotter deploy --verbose --dry-run"

[tasks."deploy:apply"]
description = "Deploy dotfiles with dotter"
run = "dotter deploy --verbose --force"

[tasks."deploy:undeploy"]
description = "Undeploy dotfiles with dotter"
run = "dotter undeploy --verbose --noconfirm --force"

# ==============================================================================
# Format Quality Gate
# ==============================================================================

[tasks."fmt:write"]
description = "Format source files"
run = [
  "dprint fmt",
  "stylua --allow-hidden .",
  "shfmt --write {{vars.bash_targets}}",
  "just --fmt",
]

[tasks."fmt:dprint"]
description = "dprint format check"
run = "dprint check"

[tasks."fmt:editorconfig"]
description = "EditorConfig check"
run = "ec"

[tasks."fmt:just"]
description = "Justfile format check"
run = "just --fmt --check"

[tasks."fmt:shfmt"]
description = "Shell format check"
run = "shfmt --diff {{vars.bash_targets}}"

[tasks."fmt:stylua"]
description = "Lua format check"
run = "stylua --allow-hidden --check ."

[tasks."fmt:all"]
description = "All format checks"
depends = [
  "fmt:dprint",
  "fmt:editorconfig",
  "fmt:just",
  "fmt:shfmt",
  "fmt:stylua",
]

# ==============================================================================
# Lint Quality Gate
# ==============================================================================

[tasks."lint:actions"]
description = "GitHub Actions lint"
run = "actionlint"

[tasks."lint:bash"]
description = "Shell lint"
shell = "bash -c"
run = """
shellcheck --shell=bash --external-sources $(shfmt --find {{vars.bash_targets}})
"""

[tasks."lint:css"]
description = "CSS lint"
run = "stylelint --config .stylelintrc.json './dotfiles/.config/**/*.css'"

[tasks."lint:lua:nvim"]
description = "Neovim Lua lint"
run = "selene dotfiles/.config/nvim"

[tasks."lint:lua:hyprland"]
description = "Hyprland Lua lint"
run = "selene --config dotfiles/.config/hypr/selene.toml dotfiles/.config/hypr/hyprland.lua"

[tasks."lint:lua:wezterm"]
description = "WezTerm Lua lint"
run = "selene dotfiles/.config/wezterm"

[tasks."lint:markdown"]
description = "Markdown lint"
run = "markdownlint-cli2"

[tasks."lint:toml"]
description = "TOML lint"
run = "taplo lint --no-schema"

[tasks."lint:typos"]
description = "Spell check"
run = "typos"

[tasks."lint:yaml"]
description = "YAML lint"
run = "yamllint ."

[tasks."lint:all"]
description = "All lint checks"
depends = [
  "lint:actions",
  "lint:bash",
  "lint:css",
  "lint:lua:hyprland",
  "lint:lua:nvim",
  "lint:lua:wezterm",
  "lint:markdown",
  "lint:toml",
  "lint:typos",
  "lint:yaml",
]

# ==============================================================================
# Security Gate
# ==============================================================================

[tasks."security:trufflehog"]
description = "Secret scanning over git history"
run = "trufflehog git file://. --results=verified,unknown --fail"

[tasks."security:semgrep"]
description = "SAST scan (OSS rules)"
run = "semgrep scan --config p/ci --oss-only --metrics=off --error --verbose"

[tasks."security:trivy:setup"]
description = "Setup Trivy"
run = "mkdir -p .tools/docker .tools/trivy"

[tasks."security:trivy"]
description = "Trivy scan"
env = { DOCKER_CONFIG = "{{config_root}}/.tools/docker" }
run = """
trivy fs \
  --scanners vuln,secret,misconfig \
  --include-dev-deps \
  --format json \
  --output .tools/trivy/trivy.json \
  --exit-code 0 \
  --include-dev-deps \
  --timeout 10m \
  .
"""
depends = ["security:trivy:setup"]

[tasks."security:trivy:table"]
description = "Convert Trivy report to table"
depends = ["security:trivy"]
run = """
trivy convert \
  --scanners vuln,secret,misconfig \
  --format table \
  .tools/trivy/trivy.json
"""

[tasks."security:trivy:sarif"]
description = "Convert Trivy report to SARIF"
depends = ["security:trivy"]
run = """
trivy convert \
  --scanners vuln,secret,misconfig \
  --format sarif \
  --output .tools/trivy/trivy-results.sarif \
  .tools/trivy/trivy.json
"""

[tasks."security:zizmor"]
description = "GitHub Actions security audit"
env = { ZIZMOR_GITHUB_TOKEN = "{{ exec(command='gh auth token') }}" }
run = "zizmor --persona pedantic .github/"

[tasks."security:all"]
description = "All security checks"
depends = [
  "security:trufflehog",
  "security:semgrep",
  "security:trivy:table",
  "security:trivy:sarif",
  "security:zizmor",
]

# ==============================================================================
# Antivirus Gate
# ==============================================================================

[tasks."antivirus:setup"]
description = "Setup ClamAV"
run = "mkdir -p {{vars.clamav_db_dir}}"

[tasks."antivirus:update"]
description = "Update ClamAV database into CLAMAV_DB_DIR"
depends = ["antivirus:setup"]
env = { MSYS_NO_PATHCONV = "1" }
run = """
podman run --rm -v "{{vars.clamav_db_dir}}:/var/lib/clamav" "{{vars.clamav_image}}" \
  sh -c "sed -i '/^NotifyClamd/d' /etc/clamav/freshclam.conf; exec freshclam --foreground"
"""

[tasks."antivirus:scan"]
description = "Malware scan of the working tree"
env = { MSYS_NO_PATHCONV = "1" }
run = """
podman run --rm --entrypoint clamscan -v "$PWD:/scandir:ro" -v "{{vars.clamav_db_dir}}:/var/lib/clamav:ro" "{{vars.clamav_image}}" \
  --recursive \
  --infected \
  /scandir
"""

[tasks."antivirus:all"]
description = "All antivirus checks"
run = [
  { task = "antivirus:update" },
  { task = "antivirus:scan" },
]

# ==============================================================================
# Documentation Gate
# ==============================================================================

[tasks."docs:install"]
description = "Install documentation dependencies"
dir = "docs"
run = "aube install --frozen-lockfile"

[tasks."docs:audit"]
description = "Audit documentation dependencies"
dir = "docs"
run = "aube audit"

[tasks."docs:build"]
description = "Build VitePress documentation [set CI_BASE_URL to override the base]"
dir = "docs"
run = "aube run docs:build"

[tasks."docs:links:setup"]
description = "Create the Lychee working directory"
run = "mkdir -p .tools/lychee"

[tasks."docs:links"]
description = "Link check over built documentation"
depends = ["docs:links:setup"]
dir = ".tools/lychee"
run = """
lychee \
  --config "{{config_root}}/.lychee.toml" \
  --root-dir "{{config_root}}/docs/dist" \
  --no-progress \
  "{{config_root}}/docs/dist"
"""

[tasks."docs:pack"]
description = "Pack documentation package archive"
dir = "docs"
run = "aube pack"

[tasks."docs:unpack:setup"]
description = "Reset the documentation output directory"
env = { DOCS_DIST = "{{vars.docs_dist}}" }
run = """
rm -rf "${DOCS_DIST}"
mkdir -p "${DOCS_DIST}"
"""

[tasks."docs:unpack"]
description = "Unpack the packed documentation archive into the output directory"
depends = ["docs:unpack:setup"]
env = { DOCS_DIST = "{{vars.docs_dist}}", DOCS_ARCHIVE = "{{vars.docs_archive}}" }
run = """
tar -xzvf ${DOCS_ARCHIVE} -C "${DOCS_DIST}"
"""

[tasks."docs:all"]
description = "All documentation checks"
run = [
  { task = "docs:install" },
  { task = "docs:audit" },
  { task = "docs:build" },
  { task = "docs:links" },
  { task = "docs:pack" },
]

# ==============================================================================
# Stage 2: Validate dotfiles configs
# ==============================================================================

# ==============================================================================
# Stage 2: AI Agents
# ==============================================================================

[tasks."validate:agent:claude"]
description = "Validate Claude Code configuration"
env = { CLAUDE_CONFIG_DIR = "{{config_root}}/dotfiles/.config/claude" }
run = "claude doctor"

[tasks."validate:agent:codex"]
description = "Validate Codex configuration"
env = { CODEX_HOME = "{{config_root}}/dotfiles/.config/codex", OPENAI_API_KEY = "-" }
run = "codex doctor"

[tasks."validate:agent:kimi"]
description = "Validate Kimi Code configuration"
env = { KIMI_CODE_HOME = "{{config_root}}/dotfiles/.config/kimi-code" }
run = "kimi doctor"

[tasks."validate:agent:opencode"]
description = "Validate OpenCode configuration"
env = { OPENCODE_CONFIG_DIR = "{{config_root}}/dotfiles/.config/opencode" }
run = "opencode debug config --pure"

# ==============================================================================
# Stage 2: Model Context Protocol server
# ==============================================================================

[tasks."validate:mcp:context7"]
description = "Check Context7 MCP through Inspector"
run = "mcp-inspector --cli --config ${PWD}/misc/mcp.json --server context7 --method tools/list"

[tasks."validate:mcp:playwright"]
description = "Check Playwright MCP through Inspector"
run = "mcp-inspector --cli --config ${PWD}/misc/mcp.json --server playwright --method tools/list"

[tasks."validate:mcp:serena"]
description = "Check Serena MCP through Inspector"
run = "mcp-inspector --cli --config ${PWD}/misc/mcp.json --server serena --method tools/list"

[tasks."validate:mcp:graphify"]
description = "Check Graphify MCP through Inspector in a project with graphify-out/graph.json"
run = "mcp-inspector --cli --config ${PWD}/misc/mcp.json --server graphify --method tools/list"

# ==============================================================================
# Stage 2: Editors
# ==============================================================================

[tasks."validate:editor:helix"]
description = "Validate Helix configuration"
shell = "nu -c"
run = """
hx --config '{{config_root}}/dotfiles/.config/helix/config.toml' --health all
"""

[tasks."validate:editor:neovim"]
description = "Validate Neovim configuration"
run = "nvim --headless -c 'qa!'"

# ==============================================================================
# Stage 2: Shell
# ==============================================================================

[tasks."validate:shell:bash"]
description = "Validate Bash configuration"
run = "bash -x -i -c 'echo OK'"

[tasks."validate:shell:nu"]
description = "Validate Nushell configuration"
run = "nu --log-level debug --login --interactive -c 'exit 0'"

[tasks."validate:shell:pwsh"]
description = "Validate PowerShell configuration"
env = { PWSH_TRACE = "1" }
run = [
  "pwsh -NoProfile -Command '$PROFILE | Select-Object *'",
  "pwsh -NoLogo -Command exit",
]

[tasks."validate:shell:zsh"]
description = "Validate Zsh configuration"
shell = "nu -c"
env = { HOME = "{{config_root}}/dotfiles" }
run = """
if (which zsh | is-not-empty) {
  zsh -x -i -c 'echo OK'
}
"""

# ==============================================================================
# Stage 2: Multiplexers
# ==============================================================================

[tasks."validate:multiplexer:herdr"]
description = "Validate Herdr configuration"
env = { HERDR_CONFIG_PATH = "{{config_root}}/dotfiles/.config/herdr/config.toml" }
run = [
  "herdr --help",
  "herdr config check",
]

[tasks."validate:multiplexer:tmux"]
description = "Validate Tmux configuration"
shell = "nu -c"
run = """
if (which tmux | is-not-empty) {
    let config = [$env.PWD, "dotfiles", ".config", "tmux", "tmux.conf"] | path join
    let socket = $"tmux-test-verify-($nu.pid)"
    let session = "test"

    ^tmux -V

    ^tmux -f $config -L $socket start-server
    print $"start-server exit code: ($env.LAST_EXIT_CODE)"

    ^tmux -L $socket new-session -d -s $session
    print $"new-session exit code: ($env.LAST_EXIT_CODE)"

    ^tmux -L $socket show-messages

    def check [socket: string, scope: string, opt: string, expected: string] {
        let actual = (^tmux -L $socket show-options $scope $opt)
        if ($actual | str contains $expected) {
            print $"OK: ($opt) = ($actual)"
            true
        } else {
            print $"FAIL: ($opt) — expected to contain '($expected)', got '($actual)'"
            false
        }
    }

    let results = [
        (check $socket "-g" "default-terminal" "tmux-256color")
        (check $socket "-s" "set-clipboard" "on")
        (check $socket "-g" "prefix" "C-a")
    ]

    do -i { ^tmux -L $socket kill-session -t $session }
    do -i { ^tmux -L $socket kill-server }

    if ($results | any {|r| not $r }) {
        exit 1
    }
}
"""

[tasks."validate:multiplexer:zellij"]
description = "Validate Zellij configuration"
env = { ZELLIJ_CONFIG_DIR = "{{config_root}}/dotfiles/.config/zellij" }
run = "zellij setup --check"

# ==============================================================================
# Stage 2: CLI Tools
# ==============================================================================

[tasks."validate:cli:git"]
description = "Validate Git config"
env = { GIT_CONFIG_GLOBAL = "{{config_root}}/dotfiles/.config/git/config" }
run = "git --no-pager config --list --show-origin --show-scope --global"

[tasks."validate:cli:starship:default"]
description = "Validate Starship config"
env = { STARSHIP_LOG = "trace", STARSHIP_CONFIG = "{{config_root}}/dotfiles/.config/starship.toml" }
run = [
  "starship print-config",
  "starship explain",
  "starship timings",
]

[tasks."validate:cli:starship:tmux"]
description = "Validate Starship Tmux config"
env = { STARSHIP_LOG = "trace", STARSHIP_CONFIG = "{{config_root}}/dotfiles/.config/starship.tmux.toml" }
run = [
  "starship print-config",
  "starship explain",
  "starship timings",
]

[tasks."validate:cli:starship:zellij"]
description = "Validate Starship Zellij config"
env = { STARSHIP_LOG = "trace", STARSHIP_CONFIG = "{{config_root}}/dotfiles/.config/starship.zellij.toml" }
run = [
  "starship print-config",
  "starship explain",
  "starship timings",
]

[tasks."validate:cli:yazi"]
description = "Validate Yazi config"
env = { YAZI_CONFIG_HOME = "{{config_root}}/dotfiles/.config/yazi" }
shell = "nu -c"
run = "yazi --debug"

# ==============================================================================
# Stage 2: Aggregate
# ==============================================================================

[tasks."validate:all"]
description = "Validate all deployed dotfiles configurations"
depends = [
  # AI Agents
  "validate:agent:claude",
  "validate:agent:codex",
  "validate:agent:kimi",
  "validate:agent:opencode",

  # MCP Server
  "validate:mcp:context7",
  "validate:mcp:playwright",
  "validate:mcp:serena",
  "validate:mcp:graphify",

  # Editors
  "validate:editor:helix",
  "validate:editor:neovim",

  # Shell
  "validate:shell:bash",
  "validate:shell:nu",
  "validate:shell:pwsh",
  "validate:shell:zsh",

  # Multiplexers
  "validate:multiplexer:herdr",
  "validate:multiplexer:tmux",
  "validate:multiplexer:zellij",

  # CLI Tools
  "validate:cli:git",
  "validate:cli:starship:default",
  "validate:cli:starship:tmux",
  "validate:cli:starship:zellij",
  "validate:cli:yazi",
]

# ==============================================================================
# Stage 2: Performance Gate
# ==============================================================================

[tasks."bench:setup"]
description = "Create the benchmark output directory"
run = "mkdir -p {{vars.bench_runs}}"

[tasks."bench:bash"]
description = "Benchmark Bash startup (raw vs configured)"
depends = ["bench:setup"]
shell = "nu -c"
run = """
(
  ^{{vars.hyperfine}}
    --export-json {{vars.bench_runs}}/bash.json
    --export-markdown {{vars.bench_runs}}/bash.md
    --command-name bash.raw '{{vars.bench_bash_raw}}'
    --command-name bash.configured '{{vars.bench_bash_configured}}'
)
"""

[tasks."bench:zsh"]
description = "Benchmark Zsh startup (raw vs configured)"
depends = ["bench:setup"]
shell = "nu -c"
env = { HOME = "{{config_root}}/dotfiles", XDG_CONFIG_HOME = "{{config_root}}/dotfiles/.config" }
run = """
(
  ^{{vars.hyperfine}}
    --export-json {{vars.bench_runs}}/zsh.json
    --export-markdown {{vars.bench_runs}}/zsh.md
    --command-name zsh.raw '{{vars.bench_zsh_raw}}'
    --command-name zsh.configured '{{vars.bench_zsh_configured}}'
)
"""

[tasks."bench:nu"]
description = "Benchmark Nushell startup (raw vs configured)"
depends = ["bench:setup"]
shell = "nu -c"
env = { XDG_CONFIG_HOME = "{{config_root}}/dotfiles/.config" }
run = """
(
  ^{{vars.hyperfine}}
    --export-json {{vars.bench_runs}}/nu.json
    --export-markdown {{vars.bench_runs}}/nu.md
    --command-name nu.raw '{{vars.bench_nu_raw}}'
    --command-name nu.configured '{{vars.bench_nu_configured}}'
)
"""

[tasks."bench:pwsh"]
description = "Benchmark PowerShell startup (raw vs configured)"
depends = ["bench:setup"]
shell = "nu -c"
run = """
(
  ^{{vars.hyperfine}}
    --export-json {{vars.bench_runs}}/pwsh.json
    --export-markdown {{vars.bench_runs}}/pwsh.md
    --command-name pwsh.raw '{{vars.bench_pwsh_raw}}'
    --command-name pwsh.configured '{{vars.bench_pwsh_configured}}'
)
"""

[tasks."bench:tmux"]
description = "Benchmark Tmux startup (raw vs configured)"
depends = ["bench:setup"]
shell = "nu -c"
run = """
(
  ^{{vars.hyperfine}}
    --export-json {{vars.bench_runs}}/tmux.json
    --export-markdown {{vars.bench_runs}}/tmux.md
    --prepare '{{vars.bench_tmux_cleanup}}'
    --conclude '{{vars.bench_tmux_cleanup}}'
    --command-name tmux.raw '{{vars.bench_tmux_raw}}'
    --command-name tmux.configured '{{vars.bench_tmux_configured}}'
)
"""

[tasks."bench:all"]
description = "Run every benchmark, one shell at a time"
run = [
  { task = "bench:nu" },
  { task = "bench:bash" },
  { task = "bench:zsh" },
  { task = "bench:pwsh" },
  { task = "bench:tmux" },
]

[tasks."bench:collect"]
description = "Aggregate the benchmark exports into a report input"
run = """
jq -s '{results: [.[].results[]]}' {{vars.bench_runs}}/*.json >{{vars.bench_dir}}/results.json
for export in {{vars.bench_runs}}/*.md; do
  printf '### %s\\n\\n' "$(basename "$export" .md)"
  cat "$export"
  printf '\\n'
done >{{vars.bench_dir}}/tables.md
"""

[tasks."bench:ci"]
description = "Compare startup performance with the committed baseline"
run = [
  { task = "deploy:sync" },
  { task = "bench:all" },
  { task = "bench:collect" },
  "{{vars.bench_report}} --arg mode check >{{vars.bench_dir}}/report.json",
  "jq -r '.report' {{vars.bench_dir}}/report.json | tee \"${PERFORMANCE_REPORT:-performance-report.md}\"",
  "jq -e '.passed' {{vars.bench_dir}}/report.json >/dev/null",
]

[tasks."bench:update"]
description = "Regenerate the performance baseline [run on the platform the gate runs on]"
run = [
  { task = "deploy:sync" },
  { task = "bench:all" },
  { task = "bench:collect" },
  "{{vars.bench_report}} --arg mode update >{{vars.bench_dir}}/report.json",
  "jq '.baseline' {{vars.bench_dir}}/report.json >{{vars.bench_dir}}/baseline.json",
  "mv -- {{vars.bench_dir}}/baseline.json misc/baseline.json",
]

# ==============================================================================
# Stage 3: Deploy documentation
# ==============================================================================

[tasks."deploy:cloudflare:preview"]
description = "Deploy the built docs to a Cloudflare Pages preview [needs CF_PAGES_PROJECT, PR_NUMBER]"
env = { CF_PAGES_DIST = "{{vars.docs_dist}}" }
run = """
wrangler pages deploy "${CF_PAGES_DIST}" \
  --project-name="${CF_PAGES_PROJECT}" \
  --branch="pr-${PR_NUMBER}" \
  --commit-dirty=false
"""

[tasks."deploy:cloudflare:production"]
description = "Deploy the built docs to Cloudflare Pages production [needs CF_PAGES_PROJECT]"
env = { CF_PAGES_DIST = "{{vars.docs_dist}}" }
run = """
wrangler pages deploy "${CF_PAGES_DIST}" \
  --project-name="${CF_PAGES_PROJECT}" \
  --commit-dirty=false
"""
