(
  ^{{vars.hyperfine}}
    --export-json {{vars.bench_runs}}/bash.json
    --export-markdown {{vars.bench_runs}}/bash.md
    --command-name bash.raw '{{vars.bench_bash_raw}}'
    --command-name bash.configured '{{vars.bench_bash_configured}}'
)
"""

[tasks."bench:zsh"]
description = "Benchmark Zsh startup (raw vs configured)"
